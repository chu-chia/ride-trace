<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#d9500f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="騎跡">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>回放｜騎跡 RideTrace</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{overflow:hidden}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3) var(--sp-2)}
  .sum div{display:flex;flex-direction:column;min-width:0}
  .sum b{font-size:19px;font-weight:700;line-height:1.15}
  .sum span{font-size:var(--fs-xs);color:var(--muted)}
  .team-brief{font-size:var(--fs-s);color:var(--muted);margin-left:var(--sp-2);font-weight:400}
  .label{font-size:var(--fs-s);font-weight:600;color:var(--muted);margin-bottom:var(--sp-2);display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
  canvas.chart{width:100%;height:130px;display:block;cursor:crosshair}
  .ev{display:grid;grid-template-columns:44px 9px 1fr;gap:var(--sp-2);align-items:baseline;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .ev:last-child{border-bottom:0}
  .ev time{font-size:var(--fs-xs);color:var(--muted)}
  .ev i{width:8px;height:8px;border-radius:50%;background:var(--c);display:block}
  /* 時間軸：側欄右邊的地圖下方 */
  .timeline{position:fixed;z-index:9;left:calc(var(--panel-w) + var(--edge) * 2);right:var(--edge);bottom:var(--edge);border-radius:var(--r-panel);padding:var(--sp-3) var(--sp-4);display:flex;align-items:center;gap:var(--sp-3)}
  body:has(.panel.small) .timeline{left:calc(var(--panel-mini-w) + var(--edge) * 2)}
  .play{width:var(--ctl-h);height:var(--ctl-h);border-radius:50%;border:0;background:var(--accent-fill);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
  .tl-time{min-width:64px;display:flex;flex-direction:column;line-height:1.2}
  .tl-time b{font-size:var(--fs-l)}
  .tl-time span{font-size:var(--fs-xs);color:var(--muted)}
  .track{position:relative;flex:1;min-width:120px;height:34px}
  .track input{position:absolute;left:0;right:0;top:12px;width:100%;margin:0;accent-color:var(--accent)}
  .track{height:40px}
  .track input{top:18px}
  .ticks{position:absolute;left:8px;right:8px;top:0;height:16px}
  /* 單一事件：12px 圓點，可點範圍 28×30px（往上延伸，不蓋到下方的時間軸滑桿）（UX-55） */
  .tick{position:absolute;top:2px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-sizing:content-box;padding:0;transform:translateX(-50%);cursor:pointer}
  .tick::after{content:"";position:absolute;inset:-16px -8px -2px}
  /* 靠太近的事件合併成數字泡泡，點了展開清單 */
  .tick.group{top:-2px;width:auto;min-width:22px;height:20px;padding:0 5px;border-radius:999px;background:var(--surface-2);color:var(--fg);border:1px solid var(--line);font:inherit;font-size:12px;font-weight:700;line-height:18px;box-sizing:border-box}
  .tick.group.sos{background:#d70015;color:#fff;border-color:#d70015}
  .tick.group::after{inset:-10px -4px -2px}
  .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tickpop{position:fixed;z-index:30;width:min(340px,calc(100vw - 16px));max-height:min(50vh,360px);display:flex;flex-direction:column;border-radius:16px;padding:8px 12px 10px;background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:var(--shadow)}
  .tickpop .tp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 0 6px;font-size:14px}
  .tickpop .tp-x{border:0;background:var(--surface-2);color:var(--fg);border-radius:50%;width:32px;height:32px;cursor:pointer}
  .tickpop .tp-list{overflow-y:auto}
  .tickpop .ev{width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);font:inherit;font-size:13px;min-height:40px}
  .timeline select{border:0;background:var(--surface-2);border-radius:var(--r-ctl);height:36px;padding:0 var(--sp-2);font-size:13px;flex:none}
  .legend{display:flex;align-items:center;gap:var(--sp-2);font-size:var(--fs-xs);color:var(--muted)}
  .legend i{display:block;flex:1;height:8px;border-radius:4px}
  .maplibregl-ctrl-bottom-right{bottom:84px}
  @media (max-width:760px){
    .timeline,body:has(.panel.small) .timeline{left:var(--sp-2);right:var(--sp-2);bottom:calc(var(--sheet-h,120px) + var(--sp-2));padding:var(--sp-2) var(--sp-3);gap:var(--sp-2)}
    .track{min-width:0}
    .tl-time b{font-size:15px}
    .maplibregl-ctrl-bottom-right{bottom:calc(var(--sheet-h,120px) + 70px)}
  }
</style>
</head>
<body>
<div class="mapwrap"><div id="map"></div></div>

<div class="tools">
  <button class="tool glass on" id="bAll" data-icon="team" aria-pressed="true">全隊</button>
  <button class="tool glass on" id="b3d" data-icon="cube" aria-pressed="true" disabled>3D</button>
  <button class="tool glass" id="bStyle" data-icon="layers">深色</button>
</div>

<div class="timeline glass">
  <button class="play" id="play" aria-label="播放"></button>
  <div class="tl-time"><b class="num" id="clock">--:--</b><span class="num" id="elapsed">+0:00</span></div>
  <div class="track"><div class="ticks" id="ticks"></div><input type="range" id="range" min="0" max="1" step="1" value="0" aria-label="時間軸"></div>
  <select id="rate" aria-label="倍速"><option value="1">1×</option><option value="2">2×</option><option value="5">5×</option><option value="10">10×</option><option value="30">30×</option><option value="60" selected>60×</option><option value="120">120×</option><option value="300">300×</option></select>
</div>

<aside class="panel glass" id="panel">
  <button class="handle" aria-expanded="true"></button>
  <div class="panel-head"><a class="icon-btn" id="back" href="/" data-icon="back" aria-label="回首頁"></a><div class="panel-title"><b id="tName">回放</b><div class="sub" id="tSub">載入中…</div></div><button class="icon-btn panel-collapse" data-icon="collapse" aria-expanded="true"></button></div>
  <div class="panel-mini"><span id="miniTeam"></span></div>
  <div class="panel-body">
    <section class="card" id="teamStatus">
      <div class="label"><span>全隊狀態<span class="team-brief" id="teamBrief"></span></span></div>
      <div class="team-rows" id="teamRows" aria-label="全隊即時狀態"></div>
    </section>
    <div class="card">
      <div class="label"><span>軌跡顏色</span></div>
      <div class="seg" id="colorBy"><button class="on" data-c="rider">隊員</button><button data-c="speed">速度</button><button data-c="alt">海拔</button></div>
      <div class="legend" id="legend" hidden style="margin-top:var(--sp-2)"></div>
    </div>
    <div class="card">
      <div class="label" id="sumTitle">整趟摘要</div>
      <div class="sum" id="sum"></div>
    </div>
    <div class="card">
      <div class="label">目前位置</div>
      <div class="sum" id="now"></div>
    </div>
    <div class="card"><div class="label">海拔（m）</div><canvas class="chart" id="altChart"></canvas></div>
    <div class="card"><div class="label">速度（km/h）</div><canvas class="chart" id="spdChart"></canvas></div>
    <div class="card"><div class="label">事件</div><div id="events"></div></div>
  </div>
</aside>

<script src="/vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
<script type="module" src="/assets/replay.js"></script>
</body>
</html>
