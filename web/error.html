<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta name="theme-color" content="#d9500f">
<title>{{title}}｜騎跡</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .err{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
  .err .card{max-width:420px;width:100%;text-align:center;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:center}
  .err .code{font-family:var(--num);font-size:13px;letter-spacing:.12em;color:var(--muted)}
  .err h1{margin:0;font-size:22px;line-height:1.3;color:var(--fg)}
  .err p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6}
  .err .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
</style>
</head>
<body>
<main class="err">
  <section class="card" role="alert">
    <div class="code">{{code}}</div>
    <h1>{{title}}</h1>
    <p>{{msg}}</p>
    <div class="acts">{{actions}}<a class="btn primary" href="/">回首頁</a></div>
  </section>
</main>
</body>
</html>
