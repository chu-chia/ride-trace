<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#d9500f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="騎跡">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>戰情室｜騎跡 RideTrace</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<script>
/* 兩種版面：手機直拿＝地圖＋分頁（改版原型，war-m.*）；電腦與手機橫向＝可自由編輯排版的浮動面板（war.*）。
   轉向或視窗寬度跨過界線就重新載入，換成另一種版面 */
(() => {
  // 手機（觸控、螢幕短邊 ≤ 820）：直拿用手機版；橫拿把版面寬度設成 1280（和以前的「電腦版」鈕一樣），整頁照電腦版排、縮小顯示（要在第一次排版前設定）
  const phone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) <= 820;
  const portrait = matchMedia('(orientation: portrait)');
  const narrow = matchMedia('(max-width:899px)');  // 電腦瀏覽器視窗拉很窄時也用手機版
  window.WAR_MODE = (phone ? portrait.matches : narrow.matches) ? 'm' : 'd';
  if (phone && window.WAR_MODE === 'd') document.querySelector('meta[name=viewport]').content = 'width=1280,user-scalable=no,viewport-fit=cover';
  document.write(`<link rel="stylesheet" href="/assets/war${window.WAR_MODE === 'm' ? '-m' : ''}.css">`);
  (phone ? portrait : narrow).addEventListener('change', () => location.reload());
})();
</script>
</head>
<body>
<template id="warD">
<div class="mapwrap"><div id="map"></div></div>
<div class="war-stage" id="stage">
  <header class="war-panel glass head" data-panel="head">
    <div class="panel-top panel-grip"><a class="icon-btn" href="/" data-icon="back" aria-label="回首頁"></a><div class="head-copy"><b id="name">載入行程中</b><span class="sub" id="sub">連線中…</span></div><span class="clock num" id="clock"></span></div>
    <div class="head-actions panel-body"><a class="panel-act" id="tripLink" href="/" data-icon="replay">行程頁</a><button class="panel-act" id="editLayout" type="button" aria-pressed="false" data-icon="edit">編輯版面</button><button class="panel-act" id="resetLayout" type="button" data-icon="reset">重設</button></div>
    <button class="icon-btn panel-toggle" data-icon="collapse" aria-label="收合行程資訊" aria-expanded="true" type="button"></button><div class="panel-resize" role="button" aria-label="縮放行程資訊面板"></div>
  </header>
  <section class="war-panel glass cards" data-panel="cards" aria-label="騎士清單">
    <div class="panel-top panel-grip"><div><h2>騎士 <span id="teamCount" class="muted"></span></h2></div><span id="teamOnline" class="panel-note"></span></div>
    <div class="card-list panel-body" id="cards"></div><button class="icon-btn panel-toggle" data-icon="collapse" aria-label="收合騎士清單" aria-expanded="true" type="button"></button><div class="panel-resize" role="button" aria-label="縮放騎士清單面板"></div>
  </section>
  <section class="war-panel glass conditions" data-panel="conditions" aria-label="沿途天氣與路況">
    <div class="panel-top panel-grip"><div><h2>沿途天氣與路況</h2></div></div>
    <div class="conditions-body panel-body" id="conditions"><p class="empty">讀取沿途資訊…</p></div><button class="icon-btn panel-toggle" data-icon="collapse" aria-label="收合沿途天氣與路況" aria-expanded="true" type="button"></button><div class="panel-resize" role="button" aria-label="縮放沿途資訊面板"></div>
  </section>
  <section class="war-panel glass feed" data-panel="feed" aria-label="事件流">
    <div class="panel-top panel-grip"><div><h2>事件</h2></div></div>
    <div class="feed-filters panel-body" role="group" aria-label="篩選事件流"><button type="button" data-feed-filter="all" aria-pressed="false">全部</button><button type="button" data-feed-filter="important" aria-pressed="true">重要</button><button type="button" data-feed-filter="road" aria-pressed="false">路況</button><button type="button" data-feed-filter="message" aria-pressed="false">訊息</button></div>
    <div class="feed-list panel-body" id="feed"></div><button class="icon-btn panel-toggle" data-icon="collapse" aria-label="收合事件" aria-expanded="true" type="button"></button><div class="panel-resize" role="button" aria-label="縮放事件流面板"></div>
  </section>
  <section class="war-panel glass prog" data-panel="progress" aria-label="全隊進度">
    <div class="panel-top panel-grip"><div><h2 id="progTitle">全隊進度</h2></div></div>
    <div class="progress-body panel-body"><div class="profile-wrap" id="pwrap"><svg id="profile" preserveAspectRatio="none"></svg></div><div class="pmeta" id="pmeta"></div></div><button class="icon-btn panel-toggle" data-icon="collapse" aria-label="收合全隊進度" aria-expanded="true" type="button"></button><div class="panel-resize" role="button" aria-label="縮放全隊進度面板"></div>
  </section>
</div>
<div class="tools" id="tools"><button class="tool glass on" id="centerTeam" data-icon="team" aria-pressed="true" type="button">全隊</button><button class="tool glass" id="mapStyle" data-icon="layers" type="button">深色</button></div>
<div class="mobile-sheet glass small" id="mobileSheet"><button id="sheetHandle" class="sheet-handle" type="button" aria-label="展開戰情室資訊" aria-expanded="false"></button><div class="sheet-summary"><a class="icon-btn" href="/" data-icon="back" aria-label="回首頁"></a><b>戰情室</b><span id="sheetBrief" class="muted">載入中…</span></div><nav class="seg sheet-tabs" aria-label="戰情室資訊"><button class="on" data-tab="cards">騎士</button><button data-tab="progress">進度</button><button data-tab="conditions">天氣路況</button><button data-tab="feed">事件</button></nav><div class="sheet-content" id="sheetContent"></div></div>
<div class="sosbar" id="sosbar"></div>
</template>
<template id="warM">
<header class="whd">
  <a class="icon-btn" id="back" href="/" data-icon="back" aria-label="回行程頁"></a>
  <div class="wttl"><h1 id="name">戰情室</h1><div class="live" id="live"><i></i><span id="hT">連線中…</span></div></div>
  <div class="sp"></div>
  <div class="kpi num" id="kpi"></div>
</header>
<div class="col l" id="colL">
  <div class="sec-t first"><span id="teamT">騎士</span></div>
  <div id="cards"></div>
  <div class="sec-t">沿途天氣與路況</div>
  <div class="wx" id="wx"><p class="empty">讀取沿途資訊…</p></div>
  <div id="stopsBox"><div class="sec-t">集合點</div><div class="wx" id="stops"></div></div>
</div>
<div class="mapw">
  <div id="map" role="region" aria-label="地圖"></div>
  <div class="sosbars" id="sosbar"></div>
  <div class="tools" role="toolbar" aria-label="地圖工具">
    <button class="tool on" id="centerTeam" data-icon="team" aria-pressed="true" type="button">全隊</button>
    <button class="tool on" id="b3d" data-icon="cube" aria-pressed="true" type="button">3D</button>
    <button class="tool" id="mapStyle" data-icon="layers" type="button">深色</button>
  </div>
</div>
<div class="prof" id="prof"><canvas id="pc" aria-label="全隊進度與海拔剖面"></canvas></div>
<div class="col r" id="colR">
  <div class="sec-t first">事件<span class="wchips" id="feedF"></span></div>
  <div id="feed"></div>
</div>
<nav class="mtabs" id="mt" aria-label="戰情室資訊"><button data-m="l" class="on" type="button">騎士</button><button data-m="r" type="button">事件</button><button data-m="p" type="button">剖面</button></nav>
</template>
<script src="/vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
<script>
{
  const m = window.WAR_MODE === 'm';
  if (m) document.body.dataset.mt = 'l';
  document.body.prepend(document.getElementById(m ? 'warM' : 'warD').content.cloneNode(true));
  const s = document.createElement('script');
  s.type = 'module';
  s.src = m ? '/assets/war-m.js' : '/assets/war.js';
  document.body.append(s);
}
</script>
</body>
</html>
