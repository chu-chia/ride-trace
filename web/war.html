<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戰情室｜騎跡 RideTrace</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{overflow:hidden}
  .wr{position:fixed;inset:0;display:grid;grid-template-columns:1fr 600px;grid-template-rows:auto 1fr 190px;gap:14px;padding:14px;pointer-events:none}
  .wr>*{pointer-events:auto}
  .head{grid-column:1/2;display:flex;align-items:center;gap:18px;padding:12px 18px;border-radius:18px;align-self:start;justify-self:start}
  .head b{font-size:24px}
  .head .t{font-size:13px;color:var(--muted)}
  .head .clock{font-size:30px;font-weight:700;margin-left:12px}
  .cards{grid-column:2;grid-row:1/3;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-content:start;overflow-y:auto}
  .cd{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
  .cd.sos{border-color:var(--crit);animation:blink 1s ease-in-out infinite alternate}
  .cd.lost{opacity:.6}
  @keyframes blink{from{box-shadow:0 0 0 0 rgba(255,69,58,.0)}to{box-shadow:0 0 22px 2px rgba(255,69,58,.7)}}
  .cd .top{display:flex;align-items:center;gap:8px;min-width:0}
  .cd .top b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cd .spd{display:flex;align-items:baseline;gap:6px}
  .cd .spd b{font-size:34px;line-height:1;font-weight:800}
  .cd .spd span{font-size:12px;color:var(--muted)}
  .cd .kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;font-size:12px;color:var(--muted)}
  .cd .kv em{font-style:normal;color:var(--fg);font-weight:600}
  .feed{grid-column:2;grid-row:3;border-radius:18px;padding:10px 14px;overflow:hidden;display:flex;flex-direction:column}
  .feed h4,.prog h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
  .feed .list{overflow:hidden;display:flex;flex-direction:column;gap:2px}
  .ev{display:grid;grid-template-columns:44px 8px 1fr;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;animation:in .4s ease}
  .ev time{font-size:12px;color:var(--muted)}
  .ev i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .ev.sos span{color:var(--crit);font-weight:700}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .prog{grid-column:1;grid-row:3;border-radius:18px;padding:10px 16px;display:flex;flex-direction:column}
  .prog .wrap{position:relative;flex:1;min-height:0}
  .prog svg{position:absolute;inset:0;width:100%;height:100%}
  .pdot{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:left 1s linear}
  .pdot b{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
  .pdot span{font-size:11px;font-weight:600;white-space:nowrap;background:var(--glass);padding:1px 6px;border-radius:8px}
  .pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .sosbar{position:fixed;z-index:20;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px}
  .sosbar div{background:#e5352b;color:#fff;font-weight:800;font-size:22px;padding:14px 26px;border-radius:16px;box-shadow:0 10px 40px rgba(229,53,43,.6);animation:blink 1s ease-in-out infinite alternate}
  .empty{color:var(--muted);font-size:13px}
  @media (max-width:760px){
    body{overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px}
    .wr{display:contents}
    .wr>*{min-width:0;width:100%}
    .head{order:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;justify-self:auto;padding:14px 16px}
    .head>div:first-child{min-width:0}
    .head b{font-size:21px;overflow-wrap:anywhere}
    .head .clock{margin:0;font-size:25px}
    .mapwrap{position:relative;inset:auto;order:2;width:100%;height:42dvh;min-height:260px;overflow:hidden;border-radius:18px}
    .cards{order:3;display:grid;grid-template-columns:minmax(0,1fr);overflow:visible}
    .cd{min-width:0}
    .prog{order:4;min-height:190px}
    .feed{order:5;min-height:190px}
    .sosbar{max-width:calc(100vw - 24px)}
    .sosbar div{font-size:17px;padding:10px 14px}
  }
</style>
</head>
<body>
<div class="mapwrap"><div id="map"></div></div>
<div class="wr">
  <div class="head glass"><div><b id="name">戰情室</b><div class="t" id="sub">連線中…</div></div><div class="clock num" id="clock"></div></div>
  <div class="cards" id="cards"></div>
  <div class="prog glass"><h4 id="progTitle">行程進度</h4><div class="wrap" id="pwrap"><svg id="profile" preserveAspectRatio="none"></svg></div><div class="pmeta" id="pmeta"></div></div>
  <div class="feed glass"><h4>事件</h4><div class="list" id="feed"></div></div>
</div>
<div class="sosbar" id="sosbar"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="/assets/war.js"></script>
</body>
</html>
