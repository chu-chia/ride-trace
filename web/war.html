<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>戰情室｜騎跡 RideTrace</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/war.css">
</head>
<body>
<div class="mapwrap"><div id="map"></div></div>
<div class="war-stage" id="stage">
  <header class="war-panel glass head" data-panel="head">
    <div class="panel-top panel-grip"><div class="head-copy"><span class="eyebrow">騎跡 RIDETRACE · 戰情室</span><b id="name">載入行程中</b><span class="muted" id="sub">連線中…</span></div><span class="clock num" id="clock"></span></div>
    <div class="head-actions panel-body"><button class="war-btn" id="editLayout" type="button" aria-pressed="false">編輯版面</button><button class="war-btn" id="resetLayout" type="button">重設版面</button><a class="war-btn" id="tripLink" href="/">行程頁 ↗</a></div>
    <button class="panel-toggle" aria-label="收合行程資訊" aria-expanded="true" type="button">⌃</button><div class="panel-resize" role="button" aria-label="縮放行程資訊面板"></div>
  </header>
  <section class="war-panel glass cards" data-panel="cards" aria-label="騎士清單">
    <div class="panel-top panel-grip"><div><span class="eyebrow">LIVE TEAM</span><h2>騎士清單 <span id="teamCount" class="muted"></span></h2></div><span id="teamOnline" class="panel-note"></span></div>
    <div class="card-list panel-body" id="cards"></div><button class="panel-toggle" aria-label="收合騎士清單" aria-expanded="true" type="button">⌃</button><div class="panel-resize" role="button" aria-label="縮放騎士清單面板"></div>
  </section>
  <section class="war-panel glass conditions" data-panel="conditions" aria-label="沿途天氣與路況">
    <div class="panel-top panel-grip"><div><span class="eyebrow">ROUTE CONDITIONS</span><h2>沿途天氣與路況</h2></div></div>
    <div class="conditions-body panel-body" id="conditions"><p class="empty">讀取沿途資訊…</p></div><button class="panel-toggle" aria-label="收合沿途天氣與路況" aria-expanded="true" type="button">⌃</button><div class="panel-resize" role="button" aria-label="縮放沿途資訊面板"></div>
  </section>
  <section class="war-panel glass feed" data-panel="feed" aria-label="事件流">
    <div class="panel-top panel-grip"><div><span class="eyebrow">LIVE LOG</span><h2>事件流</h2></div></div>
    <div class="feed-filters panel-body" role="group" aria-label="篩選事件流"><button type="button" data-feed-filter="all" aria-pressed="false">全部</button><button type="button" data-feed-filter="important" aria-pressed="true">重要</button><button type="button" data-feed-filter="road" aria-pressed="false">路況</button><button type="button" data-feed-filter="message" aria-pressed="false">訊息</button></div>
    <div class="feed-list panel-body" id="feed"></div><button class="panel-toggle" aria-label="收合事件流" aria-expanded="true" type="button">⌃</button><div class="panel-resize" role="button" aria-label="縮放事件流面板"></div>
  </section>
  <section class="war-panel glass prog" data-panel="progress" aria-label="全隊進度">
    <div class="panel-top panel-grip"><div><span class="eyebrow">TEAM PROGRESS</span><h2 id="progTitle">全隊進度</h2></div></div>
    <div class="progress-body panel-body"><div class="profile-wrap" id="pwrap"><svg id="profile" preserveAspectRatio="none"></svg></div><div class="pmeta" id="pmeta"></div></div><button class="panel-toggle" aria-label="收合全隊進度" aria-expanded="true" type="button">⌃</button><div class="panel-resize" role="button" aria-label="縮放全隊進度面板"></div>
  </section>
</div>
<div class="map-tools"><button class="war-btn" id="centerTeam" type="button">◎ 全隊置中</button><button class="war-btn" id="mapStyle" type="button">深色地圖</button></div>
<div class="mobile-sheet glass small" id="mobileSheet"><button id="sheetHandle" class="sheet-handle" type="button" aria-label="展開戰情室資訊" aria-expanded="false"></button><div class="sheet-summary"><b>戰情室</b><span id="sheetBrief" class="muted">載入中…</span><button id="sheetToggle" class="war-btn" type="button" aria-expanded="false">展開</button></div><nav class="seg sheet-tabs" aria-label="戰情室資訊"><button class="on" data-tab="cards">騎士</button><button data-tab="progress">進度</button><button data-tab="conditions">天氣路況</button><button data-tab="feed">事件</button></nav><div class="sheet-content" id="sheetContent"></div></div>
<div class="sosbar" id="sosbar"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="/assets/war.js"></script>
</body>
</html>
