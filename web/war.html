<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>戰情室｜騎跡 RideTrace</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{overflow:hidden}
  .wr{position:fixed;inset:0;overflow:hidden}
  .war-panel{position:absolute;min-width:0;min-height:0;border-radius:18px;overflow:hidden;box-sizing:border-box}
  .head{left:1%;top:1.5%;width:42%;height:76px;display:flex;align-items:center;gap:18px;padding:10px 18px}
  .head b{font-size:24px}
  .head .t{font-size:13px;color:var(--muted)}
  .head .clock{font-size:30px;font-weight:700;margin-left:auto;white-space:nowrap}
  .mapwrap{left:1%;top:11%;width:64%;height:66%}
  .cards{left:66%;top:1.5%;width:33%;height:75.5%;display:flex;flex-direction:column;padding:10px 12px}
  .card-list{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:7px;padding-right:3px}
  .cd{border-radius:12px;padding:0;border:1px solid var(--line);overflow:hidden}
  .cd.sos{border-color:var(--crit);animation:blink 1s ease-in-out infinite alternate}
  @keyframes blink{from{box-shadow:0 0 0 0 rgba(255,69,58,.0)}to{box-shadow:0 0 22px 2px rgba(255,69,58,.7)}}
  .cd summary{list-style:none;display:flex;align-items:center;gap:9px;min-height:54px;padding:6px 10px;cursor:pointer}
  .cd summary::-webkit-details-marker{display:none}
  .cd summary:focus-visible,.war-btn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .cd .rider-color{width:5px;align-self:stretch;border-radius:4px;background:var(--c);flex:none}
  .cd .rider-name{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:auto}
  .cd .speed{white-space:nowrap;font-size:18px;font-weight:700}
  .cd .speed small{font-size:11px;color:var(--muted);font-weight:400}
  .cd .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px;font-size:12px;color:var(--muted);padding:10px 14px 13px;border-top:1px solid var(--line)}
  .cd .kv em{font-style:normal;color:var(--fg);font-weight:600}
  .feed{left:66%;top:78.5%;width:33%;height:20%;padding:10px 14px;display:flex;flex-direction:column}
  .feed h4,.prog h4,.cards h4{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.06em}
  .feed .list{overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:0}
  .ev{display:grid;grid-template-columns:44px 8px 1fr;gap:8px;align-items:baseline;font-size:13.5px;padding:3px 0;animation:in .4s ease}
  .ev time{font-size:12px;color:var(--muted)}
  .ev i{width:8px;height:8px;border-radius:50%;background:var(--c)}
  .ev.sos span{color:var(--crit);font-weight:700}
  @keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  .prog{left:1%;top:78.5%;width:64%;height:20%;padding:10px 16px;display:flex;flex-direction:column}
  .prog .wrap{position:relative;flex:1;min-height:0}
  .prog svg{position:absolute;inset:0;width:100%;height:100%}
  .pdot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:left 1s linear,top 1s linear;pointer-events:none}
  .pdot b{width:22px;height:22px;border-radius:50%;background:var(--c);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:800}
  .pdot span{font-size:11px;font-weight:600;white-space:nowrap;background:var(--glass);padding:1px 6px;border-radius:8px}
  .pmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
  .sosbar{position:fixed;z-index:20;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px}
  .sosbar div{background:#e5352b;color:#fff;font-weight:800;font-size:22px;padding:14px 26px;border-radius:16px;box-shadow:0 10px 40px rgba(229,53,43,.6);animation:blink 1s ease-in-out infinite alternate}
  .empty{color:var(--muted);font-size:13px}
  .panel-grip{cursor:grab;touch-action:none;user-select:none}
  .panel-grip:active{cursor:grabbing}
  .map-grip{position:absolute;z-index:2;left:10px;top:10px;padding:7px 11px;border-radius:9px;background:var(--glass);color:var(--fg);font-size:12px}
  .panel-resize{position:absolute;z-index:3;right:0;bottom:0;width:23px;height:23px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 48%,var(--muted) 50%,var(--muted) 55%,transparent 57%);opacity:.65}
  .war-btn{border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);padding:5px 9px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
  .head-actions{display:flex;gap:6px;margin-left:8px}
  .map-actions{position:absolute;right:12px;top:10px;z-index:2}
  .panel-active{z-index:5}
  @media (max-width:760px){
    body{overflow-x:hidden;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:12px}
    .wr{display:contents}
    .wr>*{position:relative!important;left:auto!important;top:auto!important;min-width:0;width:100%!important;height:auto!important}
    .head{order:1;display:flex;flex-direction:column;align-items:flex-start;gap:8px;justify-self:auto;padding:14px 16px}
    .head>div:first-child{min-width:0}
    .head b{font-size:21px;overflow-wrap:anywhere}
    .head .clock{margin:0;font-size:25px}
    .mapwrap{order:2;height:42dvh!important;min-height:260px;overflow:hidden;border-radius:18px}
    .cards{order:3;max-height:none;overflow:visible}
    .card-list{overflow:visible}
    .cd{min-width:0}
    .prog{order:4;min-height:190px}
    .feed{order:5;min-height:190px}
    .panel-grip{cursor:default;touch-action:auto}
    .panel-resize,.map-grip{display:none}
    .head-actions{margin-left:0}
    .sosbar{max-width:calc(100vw - 24px)}
    .sosbar div{font-size:17px;padding:10px 14px}
  }
</style>
</head>
<body>
<div class="wr">
  <div class="head glass war-panel" data-panel="head"><div class="panel-grip"><b id="name">戰情室</b><div class="t" id="sub">連線中…</div></div><div class="clock num panel-grip" id="clock"></div><div class="head-actions"><button class="war-btn" id="resetLayout" type="button">重設版面</button></div><div class="panel-resize" aria-label="縮放標題面板"></div></div>
  <div class="mapwrap war-panel" data-panel="map"><div id="map"></div><div class="map-grip panel-grip">拖曳面板</div><div class="map-actions"><button class="war-btn" id="centerTeam" type="button">全隊置中</button></div><div class="panel-resize" aria-label="縮放地圖面板"></div></div>
  <div class="cards glass war-panel" data-panel="cards"><h4 class="panel-grip">騎士清單</h4><div class="card-list" id="cards"></div><div class="panel-resize" aria-label="縮放騎士面板"></div></div>
  <div class="prog glass war-panel" data-panel="progress"><h4 class="panel-grip" id="progTitle">行程進度</h4><div class="wrap" id="pwrap"><svg id="profile" preserveAspectRatio="none"></svg></div><div class="pmeta" id="pmeta"></div><div class="panel-resize" aria-label="縮放進度面板"></div></div>
  <div class="feed glass war-panel" data-panel="feed"><h4 class="panel-grip">事件</h4><div class="list" id="feed"></div><div class="panel-resize" aria-label="縮放事件面板"></div></div>
</div>
<div class="sosbar" id="sosbar"></div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="/assets/war.js"></script>
</body>
</html>
