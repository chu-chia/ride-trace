<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登入 · 騎跡</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .login{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;max-width:400px;margin:0 auto;padding:32px 20px;gap:14px}
  .login h1{margin:0;font-size:34px;letter-spacing:.04em}
  form{display:flex;flex-direction:column;gap:10px}
  .colors{display:flex;gap:8px;flex-wrap:wrap}
  .colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer}
  .colors button.on{border-color:var(--fg)}
</style>
</head>
<body>
<main class="login">
  <svg width="58" height="58" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#0071e3"/><path d="M5 19c3-1 4-6 8-7s5 2 8-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="21" cy="7" r="2.6" fill="#fff"/></svg>
  <h1>騎跡</h1>
  <p class="muted" style="margin:0">車隊即時位置、警示與整趟回放</p>
  <div class="seg" id="mode"><button class="on" data-m="login">登入</button><button data-m="register">建立帳號</button></div>
  <form id="f">
    <input class="input" id="username" autocomplete="username" placeholder="帳號（英文小寫、數字）" required>
    <input class="input" id="password" type="password" autocomplete="current-password" placeholder="密碼" required>
    <div id="regOnly" hidden style="display:flex;flex-direction:column;gap:10px">
      <input class="input" id="nickname" placeholder="暱稱（隊友看到的名字）" maxlength="12">
      <div class="small muted">代表色</div>
      <div class="colors" id="colors"></div>
    </div>
    <div class="err" id="err"></div>
    <button class="btn primary block" id="submit">登入</button>
  </form>
</main>
<script type="module">
import { api, $, $$ } from '/assets/common.js';
const PALETTE = ['#0a84ff','#ff9f0a','#30d158','#bf5af2','#ff375f','#5ac8fa','#ffd60a','#ac8e68'];
let mode = 'login', color = PALETTE[0];
$('#colors').innerHTML = PALETTE.map((c, i) => `<button type="button" style="--c:${c}" data-c="${c}" class="${i ? '' : 'on'}" aria-label="代表色 ${i + 1}"></button>`).join('');
$('#colors').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; color = b.dataset.c; $$('#colors button').forEach((x) => x.classList.toggle('on', x === b)); };
$('#mode').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m;
  $$('#mode button').forEach((x) => x.classList.toggle('on', x === b));
  $('#regOnly').hidden = mode !== 'register';
  $('#submit').textContent = mode === 'login' ? '登入' : '建立帳號';
  $('#password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
};
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  $('#err').textContent = '';
  const body = { username: $('#username').value, password: $('#password').value };
  if (mode === 'register') Object.assign(body, { nickname: $('#nickname').value || undefined, color });
  try {
    await api('/api/' + mode, { method: 'POST', body });
    location.href = new URLSearchParams(location.search).get('next') || '/';
  } catch (err) { $('#err').textContent = err.message; }
};
</script>
</body>
</html>
