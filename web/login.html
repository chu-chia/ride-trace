<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登入 · 騎跡</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{min-height:100dvh}
  .wrap{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,1fr)}

  /* 左：品牌。天色從日出琥珀漸到底色，底下是清境→武嶺的爬升剖面 */
  .hero{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:16px;
        padding:48px max(40px,6vw) 220px;background:linear-gradient(180deg,var(--hero-a),var(--hero-b) 75%)}
  .hero .logo{width:64px;height:64px}
  .hero h1{margin:0;font-size:clamp(44px,6vw,64px);line-height:1;letter-spacing:.06em}
  .hero .tag{margin:0;font-size:clamp(19px,2vw,24px);font-weight:600;line-height:1.4}
  .hero .sub{margin:0;color:var(--muted);font-size:15px;max-width:30em}
  .profile{position:absolute;left:0;right:0;bottom:0;height:200px}
  .profile svg{display:block;width:100%;height:100%}
  .profile .pt{position:absolute;font-size:12px;font-weight:600;line-height:1.3;color:var(--fg)}
  .profile .pt span{display:block;font-weight:400;color:var(--muted)}
  /* 標籤放在線的上方／下方，不壓到線（線在左下約 16%、右上約 13% 的位置） */
  .profile .a{left:max(16px,2vw);bottom:calc(16% + 12px)}
  .profile .b{right:max(16px,2vw);top:calc(13% + 12px);text-align:right}

  /* 右：表單，用系統元件 */
  .side{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--bg)}
  .form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px}
  .form h2{margin:0;font-size:24px}
  form{display:flex;flex-direction:column;gap:12px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:600;color:var(--muted)}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;background:var(--c);cursor:pointer;padding:0}
  .colors button.on{box-shadow:0 0 0 2px var(--fg)}

  @media (max-width:860px){
    .wrap{grid-template-columns:1fr}
    .hero{padding:max(28px,env(safe-area-inset-top,0px)) 20px 150px;gap:10px}
    .hero .logo{width:52px;height:52px}
    .profile{height:140px}
    .side{align-items:flex-start;padding:8px 20px 40px}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" style="fill:var(--accent-fill)"/><path d="M5 19c3-1 4-6 8-7s5 2 8-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="21" cy="7" r="2.6" fill="#fff"/></svg>
    <h1>騎跡</h1>
    <p class="tag">整隊一起上山，一起回來。</p>
    <p class="sub">隊友即時位置、落隊與失聯警示、整趟回放，還有一張只屬於你的全年足跡地圖。</p>

    <!-- 示意：台 14 甲 清境→武嶺 的爬升（裝飾用，不是真實資料） -->
    <div class="profile" aria-hidden="true">
      <svg viewBox="0 0 600 200" preserveAspectRatio="none">
        <defs>
          <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--accent);stop-opacity:.32"/>
            <stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/>
          </linearGradient>
        </defs>
        <path d="M0 200 L0 168 C40 166 60 158 90 150 S140 146 170 132 S220 128 250 112 S300 104 330 92 S380 86 410 70 S460 62 490 50 S540 40 570 30 L600 26 L600 200 Z" fill="url(#fill)"/>
        <path d="M0 168 C40 166 60 158 90 150 S140 146 170 132 S220 128 250 112 S300 104 330 92 S380 86 410 70 S460 62 490 50 S540 40 570 30 L600 26" fill="none" style="stroke:var(--accent)" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      </svg>
      <div class="pt a">清境<span class="num">1,748 m</span></div>
      <div class="pt b">武嶺<span class="num">3,275 m</span></div>
    </div>
  </section>

  <main class="side">
    <div class="form">
      <div class="seg" id="mode" role="tablist">
        <button type="button" class="on" data-m="login" role="tab" aria-selected="true">登入</button>
        <button type="button" data-m="register" role="tab" aria-selected="false">建立帳號</button>
      </div>
      <form id="f">
        <div class="field">
          <label for="username">帳號</label>
          <input class="input" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="英文小寫、數字" required>
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <div id="regOnly" hidden style="display:flex;flex-direction:column;gap:12px">
          <div class="field">
            <label for="nickname">暱稱</label>
            <input class="input" id="nickname" placeholder="隊友在地圖上看到的名字" maxlength="12">
          </div>
          <div class="field">
            <label id="colorsLabel">代表色（你在地圖上的顏色）</label>
            <div class="colors" id="colors" role="radiogroup" aria-labelledby="colorsLabel"></div>
          </div>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary block" id="submit">登入</button>
      </form>
    </div>
  </main>
</div>
<script type="module">
import { api, $, $$ } from '/assets/common.js';
const PALETTE = [['#0a84ff', '藍'], ['#ff9f0a', '橘'], ['#30d158', '綠'], ['#bf5af2', '紫'], ['#ff375f', '粉紅'], ['#5ac8fa', '淺藍'], ['#ffd60a', '黃'], ['#ac8e68', '棕']];
let mode = 'login', color = PALETTE[0][0];
$('#colors').innerHTML = PALETTE.map(([c, n], i) => `<button type="button" role="radio" aria-checked="${!i}" style="--c:${c}" data-c="${c}" class="${i ? '' : 'on'}" aria-label="${n}"></button>`).join('');
$('#colors').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  color = b.dataset.c;
  $$('#colors button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
};
$('#mode').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m;
  $$('#mode button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
  $('#regOnly').hidden = mode !== 'register';
  $('#submit').textContent = mode === 'login' ? '登入' : '建立帳號';
  $('#password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('#err').textContent = '';
};
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  $('#err').textContent = '';
  const body = { username: $('#username').value, password: $('#password').value };
  if (mode === 'register') Object.assign(body, { nickname: $('#nickname').value || undefined, color });
  try {
    await api('/api/' + mode, { method: 'POST', body });
    location.href = new URLSearchParams(location.search).get('next') || '/';
  } catch (err) { $('#err').textContent = err.message; }
};
</script>
</body>
</html>
