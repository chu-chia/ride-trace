<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>登入｜騎跡 RideTrace</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  body{min-height:100dvh}
  .wrap{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(380px,1fr)}

  /* ---------- 左：台灣經典路線巡航（地圖一律夜色） ---------- */
  .stage{position:relative;overflow:hidden;background:#07090c;color:#f5f5f7;min-height:100dvh}
  .stage #map{position:absolute;inset:0}
  .stage .maplibregl-ctrl-bottom-right{z-index:3}
  .stage .map-loading{z-index:3;background:rgba(28,28,30,.84);color:#f5f5f7}
  /* 上下壓暗，讓字浮在地圖上也看得清楚 */
  .stage::before,.stage::after{content:"";position:absolute;left:0;right:0;z-index:2;pointer-events:none}
  .stage::before{top:0;height:220px;background:linear-gradient(#07090c 10%,rgba(7,9,12,0))}
  .stage::after{bottom:0;height:240px;background:linear-gradient(rgba(7,9,12,0),#07090c 85%)}
  .hero-brand{position:absolute;z-index:3;top:max(36px,env(safe-area-inset-top,0px));left:clamp(24px,4vw,56px);right:24px}
  .hero-brand .row{display:flex;align-items:center;gap:14px}
  .hero-brand svg{width:48px;height:48px;flex:none}
  .hero-brand h1{margin:0;font-size:clamp(34px,4vw,48px);line-height:1;letter-spacing:.06em}
  .hero-brand h1 small{display:block;margin-top:5px;font-size:clamp(14px,1.5vw,18px);font-weight:500;letter-spacing:.12em;color:#ffb27a}
  .hero-brand .slogan{margin:36px 0 0;font-size:clamp(22px,2.6vw,32px);font-weight:650;line-height:1.15;letter-spacing:-.02em}
  .hero-brand .slogan-zh{margin:8px 0 0;font-size:15px;font-weight:400;color:#d1d1d6}

  .routecard{position:absolute;z-index:3;left:clamp(24px,4vw,56px);bottom:max(32px,env(safe-area-inset-bottom,0px));right:24px;max-width:420px;opacity:.7}
  .routecard .eyebrow{color:#ffb27a}
  .routecard b{display:block;font-size:clamp(20px,2vw,26px);line-height:1.2;margin-top:4px}
  .routecard .meta{font-size:14px;color:#c7c7cc;margin-top:4px}
  .routecard .meta .num{color:#f5f5f7;font-weight:600}
  .routecard .fade{transition:opacity .4s ease}
  .routecard .fade.out{opacity:0}
  .steps{display:flex;gap:6px;margin-top:16px}
  .steps i{height:3px;flex:1;max-width:44px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
  .steps i.done{background:#ff9a52}
  .steps i.on::after{content:"";position:absolute;inset:0;background:#ff9a52;transform-origin:left;animation:fill var(--dur,9s) linear forwards}
  @keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @media (prefers-reduced-motion:reduce){.steps{display:none}.routecard .fade{transition:none}}

  /* ---------- 右：表單 ---------- */
  .side{display:flex;align-items:center;justify-content:center;padding:48px 28px;background:var(--bg)}
  .form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
  .hello{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
  .hello .num{color:var(--fg);font-weight:600}
  .form h2{margin:-6px 0 0;font-size:28px;line-height:1.2}
  .invite{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
  .invite .tag{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--accent-fill);color:#fff;font-weight:800}
  .invite b{font-family:var(--num);letter-spacing:.12em}
  form{display:flex;flex-direction:column;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;font-weight:600;color:var(--muted)}

  /* 註冊：即時預覽你在地圖上的樣子（沿用地圖頁的 .rider 標記） */
  .me-preview{position:relative;height:118px;border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#1b222c,#0c1015)}
  .me-preview svg.road{position:absolute;inset:0;width:100%;height:100%}
  .me-preview .rider{position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);cursor:default}
  .me-preview .rider .arrow{display:none}
  .me-preview .cap{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#98989d}
  .colors{display:flex;gap:10px;flex-wrap:wrap}
  .colors button{width:36px;height:36px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent;background:var(--c);cursor:pointer;padding:0}
  .colors button.on{box-shadow:0 0 0 2px var(--fg)}

  @media (max-width:900px){
    .wrap{grid-template-columns:1fr}
    .stage{min-height:0;height:clamp(300px,42dvh,380px)}
    .hero-brand{top:max(20px,env(safe-area-inset-top,0px))}
    .hero-brand svg{width:40px;height:40px}
    .hero-brand .slogan{margin-top:24px;font-size:23px}
    .hero-brand .slogan-zh{font-size:13px}
    .routecard{bottom:18px}
    .stage::after{height:170px}
    .side{align-items:flex-start;padding:24px 20px 48px}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" aria-label="台灣經典騎車路線">
    <div id="map" aria-hidden="true"></div>
    <div class="hero-brand">
      <div class="row">
        <svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" style="fill:#d9500f"/><path d="M5 19c3-1 4-6 8-7s5 2 8-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/><circle cx="21" cy="7" r="2.6" fill="#fff"/></svg>
        <h1>騎跡<small>RideTrace</small></h1>
      </div>
      <p class="slogan">Every ride leaves a trace.</p>
      <p class="slogan-zh">每一趟騎乘，都會留下足跡。</p>
    </div>
    <div class="routecard" aria-live="polite">
      <div class="fade" id="rcText">
        <div class="eyebrow" id="rcRoad">台灣經典路線</div>
        <b id="rcName">北宜、北橫、蘇花、武嶺……</b>
        <div class="meta" id="rcMeta">下一趟想騎去哪？</div>
      </div>
      <div class="steps" id="steps" aria-hidden="true"></div>
    </div>
  </section>

  <main class="side">
    <div class="form">
      <div class="hello" id="hello"></div>
      <h2 id="title">登入，繼續上路</h2>
      <div class="invite" id="invite" hidden>
        <span class="tag" aria-hidden="true">邀</span>
        <div class="small">你收到行程邀請 <b id="inviteCode"></b><br><span class="muted">登入或建立帳號後會自動加入</span></div>
      </div>
      <div class="seg" id="mode" role="tablist">
        <button type="button" class="on" data-m="login" role="tab" aria-selected="true">登入</button>
        <button type="button" data-m="register" role="tab" aria-selected="false">建立帳號</button>
      </div>
      <form id="f">
        <div id="regOnly" hidden style="display:flex;flex-direction:column;gap:14px">
          <div class="me-preview" aria-hidden="true">
            <svg class="road" viewBox="0 0 380 118" preserveAspectRatio="none"><path d="M-10 100 C60 90 90 60 160 58 S280 70 390 20" fill="none" stroke="#3a4250" stroke-width="10" stroke-linecap="round"/><path d="M-10 100 C60 90 90 60 160 58 S280 70 390 20" fill="none" stroke="#596274" stroke-width="1.5" stroke-dasharray="6 8"/></svg>
            <span class="cap">你在地圖上的樣子</span>
            <div class="rider" id="preview"><div class="arrow"></div><div class="dot" id="pvDot"></div><div class="name" id="pvName"></div></div>
          </div>
          <div class="field">
            <label for="nickname">暱稱</label>
            <input class="input" id="nickname" placeholder="隊友在地圖上看到的名字" maxlength="12">
          </div>
          <div class="field">
            <label id="colorsLabel">代表色</label>
            <div class="colors" id="colors" role="radiogroup" aria-labelledby="colorsLabel"></div>
          </div>
        </div>
        <div class="field">
          <label for="username">帳號</label>
          <input class="input" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="英文小寫、數字" required>
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <input class="input" id="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="err" id="err" role="alert"></div>
        <button class="btn primary block" id="submit">登入</button>
      </form>
    </div>
  </main>
</div>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module">
import { api, $, $$, inkOn, initialOf, pad2 } from '/assets/common.js';

/* ---------- 右：表單 ---------- */
const now = new Date(), h = now.getHours();
const line = h >= 4 && h < 8 ? '清晨了，山上可能有雲海。' : h < 17 && h >= 8 ? '天氣不錯，適合出去騎一圈。' : h >= 17 && h < 20 ? '傍晚了，騎去看夕陽嗎？' : '夜騎記得開大燈、注意保暖。';
$('#hello').innerHTML = `<span class="num">${pad2(h)}:${pad2(now.getMinutes())}</span>${line}`;

const next = new URLSearchParams(location.search).get('next') || '/';
const code = (next.match(/[?&]join=([A-Za-z0-9]{6})/) || [])[1];
if (code) { $('#invite').hidden = false; $('#inviteCode').textContent = code.toUpperCase(); }

const PALETTE = [['#0a84ff', '藍'], ['#ff9f0a', '橘'], ['#30d158', '綠'], ['#bf5af2', '紫'], ['#ff375f', '粉紅'], ['#5ac8fa', '淺藍'], ['#ffd60a', '黃'], ['#ac8e68', '棕']];
let mode = 'login', color = PALETTE[0][0];
$('#colors').innerHTML = PALETTE.map(([c, n], i) => `<button type="button" role="radio" aria-checked="${!i}" style="--c:${c}" data-c="${c}" class="${i ? '' : 'on'}" aria-label="${n}"></button>`).join('');
function preview() {
  const name = $('#nickname').value.trim() || $('#username').value.trim() || '你';
  const el = $('#preview');
  el.style.setProperty('--c', color);
  el.style.setProperty('--ink', inkOn(color));
  $('#pvDot').textContent = initialOf(name);
  $('#pvName').textContent = name;
}
$('#colors').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  color = b.dataset.c;
  $$('#colors button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', x === b); });
  preview();
};
$('#nickname').oninput = preview;
$('#username').oninput = preview;
$('#mode').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.m;
  $$('#mode button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-selected', x === b); });
  $('#regOnly').hidden = mode !== 'register';
  $('#title').textContent = mode === 'login' ? '登入，繼續上路' : '建立帳號，加入車隊';
  $('#submit').textContent = mode === 'login' ? '登入' : '建立帳號';
  $('#password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('#err').textContent = '';
  if (mode === 'register') { preview(); $('#nickname').focus(); }
};
$('#f').onsubmit = async (e) => {
  e.preventDefault();
  $('#err').textContent = '';
  const body = { username: $('#username').value, password: $('#password').value };
  if (mode === 'register') Object.assign(body, { nickname: $('#nickname').value || undefined, color });
  try {
    await api('/api/' + mode, { method: 'POST', body });
    location.href = next;
  } catch (err) { $('#err').textContent = err.message; }
};

/* ---------- 左：經典路線巡航 ---------- */
// 地圖只是背景：載入失敗也不影響登入
import('/assets/login-stage.js').then((m) => m.start()).catch(() => {});
</script>
</body>
</html>
