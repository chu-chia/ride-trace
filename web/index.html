<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="騎跡">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>騎跡 RideTrace</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#d9500f">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 首頁版面照改版原型（ride-trace-redesign/index.html）：品牌列 → 日期問候＋右上頭像（進設定）→ 足跡卡 →
     「現在該做什麼」卡 → 開新的一趟 → 我的行程（分組）→ 足跡統計。沒有底部分頁列：足跡從足跡卡進、設定從頭像進 */
  .page{max-width:620px;gap:0;padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(28px,env(safe-area-inset-bottom,0px))}
  .hb{display:flex;align-items:center;gap:8px;margin:4px 2px 10px}
  .hb .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#ff8a3d,#c2410c);display:grid;place-items:center;color:#fff;flex:none}
  .hb .logo svg{width:18px;height:18px}
  .hb b{font-size:17px}.hb small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.5px}
  .hello{display:flex;align-items:flex-end;gap:10px;margin:0 2px 14px}
  .hello .m{flex:1;min-width:0}
  .hello .d{font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.5px}
  .hello h1{font-size:25px;margin:2px 0 0;line-height:1.2}
  .hello .me{flex:none;border-radius:50%;display:block}
  .hello .me .avatar{width:40px;height:40px;font-size:16px}

  /* 足跡卡：去過的每一條路。地圖類內容固定夜色（深藍灰底＋右上暖光），不跟深淺色切換 */
  .paths{display:flex;align-items:stretch;gap:8px;border-radius:20px;padding:16px;margin-bottom:12px;color:#fff;position:relative;overflow:hidden;min-height:196px;
    background:radial-gradient(75% 85% at 100% 0%,rgba(150,88,40,.42) 0%,rgba(150,88,40,0) 70%),linear-gradient(160deg,#161c25 0%,#11161d 60%,#0f1318 100%)}
  .paths .l{flex:1;display:flex;flex-direction:column;min-width:0}
  .paths .k{font-size:12px;font-weight:700;color:#ff8a3d}
  .paths h2{font-size:19px;margin:4px 0 auto;padding-bottom:16px}
  .paths .n{margin-top:8px;line-height:1.15}
  .paths .n b{font-size:19px;font-family:var(--num);font-variant-numeric:tabular-nums}
  .paths .n span{display:block;font-size:11.5px;color:rgba(255,255,255,.6)}
  .paths .n.tip span{font-size:13px;color:rgba(255,255,255,.75);line-height:1.45}
  .paths .art{position:relative;width:46%;max-width:190px;flex:none}
  .paths canvas,.paths .preview{position:absolute;inset:0;width:100%;height:100%}
  .paths .preview{object-fit:fill}
  .paths .go{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center}
  .paths .go svg{width:16px;height:16px}

  /* 「現在該做什麼」卡：依狀態換內容（騎乘中／準備或集合中／沒有行程），主按鈕只有一個 */
  .live{background:linear-gradient(135deg,#c2410c,#7c2d12);color:#fff;border-radius:20px;padding:16px;position:relative;overflow:hidden}
  @media (prefers-color-scheme: dark){.live{background:linear-gradient(135deg,#3a1d08,#150b04)}}
  .live .row1{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;opacity:.9}
  .live .pulse{width:9px;height:9px;border-radius:50%;background:#30d158;flex:none;box-shadow:0 0 0 0 rgba(48,209,88,.6);animation:pl 1.6s infinite}
  .live .pulse.wait{background:#ff8a3d}
  .live .pulse.idle{background:rgba(255,255,255,.55);animation:none}
  @keyframes pl{70%{box-shadow:0 0 0 10px rgba(48,209,88,0)}100%{box-shadow:0 0 0 0 rgba(48,209,88,0)}}
  @media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}
  .live h2{margin:8px 0 2px;font-size:22px;line-height:1.25;overflow-wrap:anywhere}
  .live .sub{font-size:14px;opacity:.85}
  .live .avs{display:flex;margin:12px 0 14px;align-items:center}
  .live .avs .av{position:relative;margin-right:-8px}
  .live .avs .avatar{width:34px;height:34px;font-size:13px;box-shadow:0 0 0 2px #2a1608}
  .live .avs .st{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid #2a1608;background:#30d158}
  .live .avs .st.off{background:#8e8e93}.live .avs .st.lag{background:#ffd60a}
  .live .avs .more{margin-left:14px;font-size:13px;font-weight:700;opacity:.8}
  .live .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;margin-bottom:6px}
  .live .prog i{display:block;height:100%;background:#ff8a3d;border-radius:3px}
  .live .acts{display:flex;gap:8px;margin-top:12px}
  .live .acts .btn{flex:1;background:rgba(255,255,255,.14);color:#fff;text-decoration:none;min-height:44px}
  .live .acts .btn.primary{background:#ff8a3d;color:#1d1d1f;flex:1.4}
  .stepper{display:flex;align-items:center;margin:10px 0 4px;font-size:12px;font-weight:700;color:rgba(255,255,255,.65)}
  .stepper .s{display:flex;align-items:center;gap:5px;white-space:nowrap}
  .stepper .s i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;background:rgba(255,255,255,.18);color:#fff}
  .stepper .s.done i{background:#30d158}
  .stepper .s.cur{color:#fff}
  .stepper .s.cur i{background:#ff8a3d;color:#1d1d1f;box-shadow:0 0 0 3px rgba(255,138,61,.3)}
  .stepper .ln{flex:1;height:2px;background:rgba(255,255,255,.18);margin:0 6px;min-width:8px}
  .stepper .ln.done{background:#30d158}
  .empty{background:var(--surface);border-radius:20px;padding:18px 16px}
  .empty h2{margin:0 0 4px;font-size:21px}
  .empty p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .btn.main{width:100%;min-height:54px;border-radius:14px;font-size:17px;font-weight:800}

  .sec-t{font-size:13px;font-weight:700;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
  .sec-t a{color:var(--accent-ink);font-weight:600;text-decoration:none}
  .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .quick button{border:0;background:var(--surface);color:var(--fg);font:inherit;border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:86px;cursor:pointer}
  .quick b{font-size:15.5px}.quick span{font-size:12.5px;color:var(--muted)}
  .quick .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink)}
  .quick .ic svg{width:18px;height:18px}
  .quick button:disabled{opacity:.6}
  .namef{display:flex;flex-direction:column;gap:8px;margin-top:10px;background:var(--surface);border-radius:16px;padding:12px}
  .namef[hidden]{display:none}
  .namef .r{display:flex;gap:8px}.namef .r .btn{flex:1}
  .join{display:flex;gap:8px;margin-top:10px}
  .join input{flex:1;min-width:0;height:46px;border-radius:12px;border:0;background:var(--surface);color:var(--fg);padding:0 14px;font-size:16px;letter-spacing:2px;text-transform:uppercase}
  .join .btn{min-height:46px}
  .err:empty{display:none}
  .err{margin-top:8px}

  /* 我的行程：依階段分組（進行中／即將出發／騎過的），每一列都標現在在哪個階段 */
  .grp{font-size:12px;font-weight:800;color:var(--muted);padding:10px 14px 4px;letter-spacing:.5px}
  .tl .li{min-height:56px;border-bottom:0;text-decoration:none}
  .tl .li+.li{border-top:1px solid var(--line)}
  .tl .ta{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px;flex:none}
  .tl .m{flex:1;min-width:0}
  .tl .m b{display:block;font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tl .m span{font-size:13px;color:var(--muted)}
  .tl .r{font-size:13px;color:var(--muted);flex:none}
  .tl .chev{width:16px;height:16px;color:var(--muted);flex:none}
  .tl .moreb{border:0;background:none;font:inherit;width:100%;padding:12px 14px;color:var(--accent-ink);font-weight:600;font-size:14px;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
  .stg{font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px;white-space:nowrap}
  .stg.ride{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok-ink)}
  .stg.gather{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink)}
  .stg.prep,.stg.done{background:var(--surface-2);color:var(--muted)}

  /* 足跡統計：鄉鎮完成度環＋三個數字 */
  .fps{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}
  .fps .ring{width:64px;height:64px;flex:none}
  .fps .st{flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;text-align:center}
  .fps .st b{display:block;font-size:18px}.fps .st span{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<main class="page">
  <div class="hb"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18c3-1 3-5 7-6s4-5 7-6"/></svg></span><b>騎跡</b><small lang="en">RideTrace</small></div>
  <header class="hello"><div class="m"><div class="d" id="today"></div><h1 id="hello">騎跡</h1></div><a class="me" href="/settings" id="me" aria-label="設定"></a></header>

  <a class="paths" href="/footprint" aria-label="我的足跡：打開全年迷霧地圖">
    <div class="l"><span class="k">我的足跡</span><h2 id="fpTitle">去過的每一條路</h2><div id="fpNums"></div></div>
    <div class="art"><img class="preview" id="fpPreview" alt="" hidden><canvas id="fpCanvas" aria-hidden="true"></canvas></div>
    <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></span>
  </a>

  <div id="hero"></div>

  <div class="sec-t">開新的一趟</div>
  <div class="quick">
    <button type="button" id="qPlan"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><b>建立行程</b><span>取個名字，先規劃路線再邀人</span></button>
    <button type="button" id="qNow"><span class="ic"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></span><b>臨時開團</b><span>現在就出發，直接進行程</span></button>
  </div>
  <form class="namef" id="planF" hidden>
    <input class="input" id="tripName" placeholder="行程名稱，例如 武嶺日出團" maxlength="30" aria-label="行程名稱（留空會用今天日期命名）">
    <div class="r"><button type="button" class="btn" id="planCancel">取消</button><button class="btn primary">建立並規劃路線</button></div>
  </form>
  <form class="join" id="joinF">
    <input id="code" placeholder="輸入邀請碼" maxlength="6" autocomplete="off" autocapitalize="characters" aria-label="6 碼邀請碼">
    <button class="btn primary">加入</button>
  </form>
  <div class="err" id="err" role="alert"></div>

  <div class="sec-t">我的行程</div>
  <div class="list tl" id="trips"><div class="li"><span class="muted">載入中…</span></div></div>

  <div class="sec-t">我的足跡 <a href="/footprint?tab=towns">全部 ›</a></div>
  <a class="card fps" href="/footprint?tab=towns" aria-label="鄉鎮足跡與統計">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle id="ringArc" cx="32" cy="32" r="27" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 170" transform="rotate(-90 32 32)"/><text id="ringPct" x="32" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="currentColor">–</text></svg>
    <div class="st num"><div><b id="stTowns">–</b><span id="stTownsOf">鄉鎮</span></div><div><b id="stKm">–</b><span>公里</span></div><div><b id="stDays">–</b><span>騎車天數</span></div></div>
  </a>
</main>
<script type="module">
import { api, $, esc, avatar, clock, dur, isWeak, toast } from '/assets/common.js';
import { drawFootprint } from '/assets/footmini.js';
import { swr } from '/assets/swr.js';
const d = new Date();
$('#today').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 星期${'日一二三四五六'[d.getDay()]}`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

// 從「你被移出行程」的通知點進來（UX-03）：說明一次，再把網址清乾淨
{
  const q = new URLSearchParams(location.search);
  if (q.has('kicked')) {
    toast(`你已被移出「${q.get('name') || '行程'}」`, { icon: '!', sub: '團主把你移出了這個行程，行程頁不能再打開' });
    history.replaceState(null, '', '/');
  }
}
const me = await api('/api/me');
// 0～4 點是深夜，不說「早安」（UX-48）
const hr = d.getHours();
$('#hello').textContent = `${hr < 4 ? '夜深了' : hr < 11 ? '早安' : hr < 18 ? '午安' : '晚安'}，${me.nickname}`;
$('#me').innerHTML = avatar(me);   // 頭像直接進設定（登出、關於、管理後台都搬到設定頁）

/* ---------- 「現在該做什麼」卡 ---------- */
const PRE_STALE_MS = 10 * 60_000;  // 和行程頁一樣：開始前的位置超過 10 分鐘沒更新就不算在分享
const PREP_RECENT_MS = 3 * 86400_000;  // 準備中的行程只在建立 3 天內放上來，舊的留在列表
const STAGES = [['prep', '準備'], ['gather', '集合'], ['ride', '騎乘'], ['done', '結束']];
function stepper(cur) {
  const ci = STAGES.findIndex(([k]) => k === cur);
  return `<div class="stepper" aria-label="行程階段：${STAGES[ci][1]}">${STAGES.map(([, n], i) =>
    `${i ? `<span class="ln ${i <= ci ? 'done' : ''}"></span>` : ''}<span class="s ${i < ci ? 'done' : i === ci ? 'cur' : ''}"><i>${i < ci ? '✓' : i + 1}</i>${n}</span>`).join('')}</div>`;
}
// 成員的小圓點：綠＝正在回報、黃＝訊號弱、灰＝沒有位置或已結束
function dotOf(m, planned) {
  const s = m.state || {};
  if (s.status === 'done' || s.lat == null || s.lat === '') return 'off';
  if (planned) return s.seen && Date.now() - +s.seen <= PRE_STALE_MS ? '' : 'off';
  return isWeak(s) ? 'lag' : '';
}
function avatars(members, planned) {
  const show = members.slice(0, 6);
  return `<div class="avs">${show.map((m) => { const st = dotOf(m, planned); return `<span class="av">${avatar(m)}<i class="st ${st}"></i></span>`; }).join('')}${members.length > show.length ? `<span class="more">+${members.length - show.length}</span>` : ''}</div>`;
}
const routeLine = (rs) => {
  const p = rs?.points || [], km = rs?.summary?.km;
  if (!p.length || km == null) return '';
  const a = p[0].name || '起點', b = p[p.length - 1].name || '終點';
  return `${esc(a)} → ${esc(b)}・${km >= 10 ? Math.round(km) : km.toFixed(1)} 公里`;
};
const getRoute = (id) => api(`/api/trips/${id}/route/summary`).catch(() => ({}));

async function heroLive(t) {
  const [det, rs] = await Promise.all([api('/api/trips/' + t.id), getRoute(t.id)]);
  const mine = det.members.find((m) => m.uid === me.uid);
  const riding = mine?.active && mine.state?.status !== 'done';
  const line = routeLine(rs);
  const km = rs?.summary?.km;
  // 全隊進度：還在騎的人投影到路線上的平均里程
  const kms = det.members.filter((m) => m.active && m.state?.route_km != null && m.state.route_km !== '').map((m) => +m.state.route_km);
  const avg = kms.length ? kms.reduce((a, b) => a + b, 0) / kms.length : null;
  const pct = km && avg != null ? Math.max(0, Math.min(100, Math.round(avg / km * 100))) : null;
  const on = det.members.filter((m) => dotOf(m, false) !== 'off').length;
  return `<section class="live">
    <div class="row1"><span class="pulse"></span>${riding ? '你正在騎' : '車隊騎乘中'}・已出發 <span class="num">${dur(Date.now() - +t.started)}</span></div>
    <h2>${esc(t.name)}</h2><div class="sub">${line || `${det.members.length} 人・沒有規劃路線`}</div>
    ${stepper('ride')}
    ${avatars(det.members, false)}
    ${pct != null ? `<div class="prog"><i style="width:${pct}%"></i></div><div class="sub num">全隊進度 ${pct}%・平均 ${avg.toFixed(1)}／${Math.round(km)} 公里</div>` : `<div class="sub">${on}／${det.members.length} 人正在回報位置</div>`}
    <div class="acts"><a class="btn primary" href="/trip?id=${t.id}">回到地圖</a><a class="btn" href="/war?id=${t.id}">戰情室</a></div></section>`;
}
async function heroPlanned(t) {
  const [det, rs] = await Promise.all([api('/api/trips/' + t.id), getRoute(t.id)]);
  const sharing = det.members.filter((m) => dotOf(m, true) !== 'off').length;
  const gather = sharing > 0;
  const line = routeLine(rs);
  const wait = det.is_owner && !line;
  return { gather, html: `<section class="live">
    <div class="row1"><span class="pulse ${gather ? 'wait' : 'idle'}"></span>${gather ? '集合中・還沒出發' : `準備中・建立於 ${new Date(+t.created).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' })}`}</div>
    <h2>${esc(t.name)}</h2><div class="sub">${line || '還沒規劃路線'}</div>
    ${stepper(gather ? 'gather' : 'prep')}
    ${avatars(det.members, true)}
    <div class="sub">${gather ? `${sharing}／${det.members.length} 人在分享位置` : `${det.members.length} 人・邀請碼 <span class="num">${esc(t.invite)}</span>`}</div>
    <div class="acts">${wait ? `<a class="btn primary" href="/plan?trip=${t.id}">規劃路線</a><a class="btn" href="/trip?id=${t.id}">打開行程</a>` : `<a class="btn primary" href="/trip?id=${t.id}">${gather ? '前往集合' : '打開行程'}</a>`}</div></section>` };
}
const heroEmpty = () => `<section class="empty"><h2>下一趟要去哪？</h2><p>建立一趟行程、規劃路線、邀請朋友；出發當天大家就看得到彼此。</p>
  <button type="button" class="btn primary main" id="heroNew">建立行程</button></section>`;

/* ---------- 我的行程 ---------- */
const ST_NAME = { prep: '準備中', gather: '集合中', ride: '騎乘中', done: '已結束' };
const md = (ms) => new Date(+ms).toLocaleDateString('zh-TW', { month: 'numeric', day: 'numeric' });
const tripWhen = (t) => (t.started ? `${md(t.started)} ${clock(+t.started)} 出發` : `建立於 ${md(t.created)}`);
const PAST_SHOW = 5;
let showAllPast = false;
function row(t, stage) {
  const ended = t.status === 'ended';
  const bg = ended ? '#8e8e93' : t.status === 'live' ? 'var(--accent-fill)' : '#5856d6';
  return `<a class="li" href="/${ended ? 'replay' : 'trip'}?id=${t.id}"><span class="ta" style="background:${bg}" aria-hidden="true">${esc([...(t.name || '騎')][0])}</span><span class="m"><b>${esc(t.name)}</b><span>${tripWhen(t)}・${t.member_count} 人<span class="stg ${stage}">${ST_NAME[stage]}</span></span></span>${ended ? '<span class="r">回放</span>' : CHEV}</a>`;
}
function renderList(trips, heroId, heroStage) {
  if (!trips.length) { $('#trips').innerHTML = '<div class="li"><span class="muted">還沒有行程。在上面建立一個，或輸入朋友給的邀請碼。</span></div>'; return; }
  const stageOf = (t) => (t.status === 'live' ? 'ride' : t.status === 'ended' ? 'done' : t.id === heroId ? heroStage : 'prep');
  const live = trips.filter((t) => t.status === 'live'), soon = trips.filter((t) => t.status === 'planned'), past = trips.filter((t) => t.status === 'ended');
  const pastShown = showAllPast ? past : past.slice(0, PAST_SHOW);
  const grp = (name, ts) => (ts.length ? `<div class="grp">${name}</div>${ts.map((t) => row(t, stageOf(t))).join('')}` : '');
  $('#trips').innerHTML = grp('進行中', live) + grp('即將出發', soon) + grp('騎過的', pastShown)
    + (past.length > pastShown.length ? `<button type="button" class="moreb" id="morePast">顯示全部 ${past.length} 趟騎過的</button>` : '');
  const mb = $('#morePast');
  if (mb) mb.onclick = () => { showAllPast = true; renderList(trips, heroId, heroStage); };
}

async function loadTrips() {
  const trips = await api('/api/trips');
  const live = trips.find((t) => t.status === 'live');
  const planned = trips.find((t) => t.status === 'planned');
  let heroId = null, heroStage = 'prep', html = '';
  try {
    if (live) { heroId = live.id; html = await heroLive(live); }
    else if (planned) {
      const h = await heroPlanned(planned);
      // 舊的準備中行程（建立超過 3 天、沒人在分享位置）不佔最上面
      if (h.gather || Date.now() - +planned.created < PREP_RECENT_MS) { heroId = planned.id; heroStage = h.gather ? 'gather' : 'prep'; html = h.html; }
    }
  } catch { html = ''; heroId = null; }
  $('#hero').innerHTML = html || heroEmpty();
  if ($('#heroNew')) $('#heroNew').onclick = openPlanForm;
  renderList(trips, heroId, heroStage);
}

/* ---------- 開新的一趟、加入 ---------- */
async function join(code) {
  try { const t = await api('/api/trips/join', { method: 'POST', body: { code } }); location.href = '/trip?id=' + t.id; }
  catch (e) { $('#err').textContent = e.message; }
}
async function create(name, then) {
  $('#err').textContent = '';
  try { const t = await api('/api/trips', { method: 'POST', body: { name } }); location.href = then(t.id); }
  catch (err) { $('#err').textContent = err.message; $('#qNow').disabled = false; }
}
function openPlanForm() { $('#planF').hidden = false; $('#tripName').focus(); }
$('#qPlan').onclick = openPlanForm;
$('#planCancel').onclick = () => { $('#planF').hidden = true; };
// 建立行程：先取名字，建好直接進規劃路線
$('#planF').onsubmit = (e) => { e.preventDefault(); create($('#tripName').value.trim(), (id) => `/plan?trip=${id}`); };
// 臨時開團：不用取名，交給後端用台灣日期命名（例如「11/19（四）臨時開團」，UX-44）
$('#qNow').onclick = () => { $('#qNow').disabled = true; create('', (id) => `/trip?id=${id}`); };
$('#joinF').onsubmit = (e) => { e.preventDefault(); document.activeElement?.blur(); join($('#code').value.trim().toUpperCase()); };

const pending = new URLSearchParams(location.search).get('join');
if (pending) join(pending.toUpperCase());
// 後端重啟或沒網路時不要一直停在「載入中…」：顯示原因並自動重試
async function loadTripsRetry(wait = 3000) {
  try { await loadTrips(); }
  catch (err) {
    $('#trips').innerHTML = `<div class="li"><span class="muted">${esc(err.message)}・${Math.round(wait / 1000)} 秒後自動重試</span></div>`;
    setTimeout(() => loadTripsRetry(Math.min(30000, wait * 2)), wait);
  }
}
loadTripsRetry();
// 回到首頁（例如從行程頁按返回、或 iPhone 從背景切回來）時更新進行中的卡
addEventListener('pageshow', (e) => { if (e.persisted) loadTrips().catch(() => {}); });

/* ---------- 足跡卡與足跡統計 ---------- */
// 先放上次的畫布快照，再以快取格子和最新格子依序重畫。
const previewKey = `qiji-footprint-preview:${me.uid}`;
try {
  const image = localStorage.getItem(previewKey);
  if (image) { $('#fpPreview').src = image; $('#fpPreview').hidden = false; }
} catch { /* 儲存空間不可用 */ }
let fpSummary = null, fpCells = null;
const nItem = (v, label) => `<div class="n"><b>${v}</b><span>${label}</span></div>`;
function renderFpNums() {
  if (fpSummary && !fpSummary.points) {
    $('#stKm').textContent = '0'; $('#stDays').textContent = '0';
    $('#fpTitle').textContent = '還沒有足跡';
    $('#fpNums').innerHTML = '<div class="n tip"><span>騎完第一趟，走過的路就會一格一格亮起來</span></div>';
    $('#fpPreview').hidden = true;
    $('#fpCanvas').getContext('2d').clearRect(0, 0, $('#fpCanvas').width, $('#fpCanvas').height);
    try { localStorage.removeItem(previewKey); } catch { /* 儲存空間不可用 */ }
    return;
  }
  $('#fpTitle').textContent = '去過的每一條路';  // 空狀態改過標題，有資料時要改回來（UX-39）
  const n = fpSummary ? Object.keys(fpSummary.days).length : null;
  const km = fpSummary ? Object.values(fpSummary.days).reduce((a, b) => a + b, 0) : null;
  $('#fpNums').innerHTML = (n == null ? '' : nItem(n.toLocaleString(), '天有紀錄') + nItem(`${Math.round(km).toLocaleString()} km`, '總里程'))
    + (fpCells ? nItem(fpCells.count.toLocaleString(), '個點亮的格子') : '');
  if (fpSummary) { $('#stKm').textContent = Math.round(km).toLocaleString(); $('#stDays').textContent = n.toLocaleString(); }
}
function paintFp() {
  if (!fpCells?.cells?.length) {
    $('#fpPreview').hidden = true;
    try { localStorage.removeItem(previewKey); } catch { /* 儲存空間不可用 */ }
    return;
  }
  drawFootprint($('#fpCanvas'), fpCells.cells, fpCells.cell_deg, { pad: 6 });
  $('#fpPreview').hidden = true;
  try { localStorage.setItem(previewKey, $('#fpCanvas').toDataURL('image/png')); } catch { /* 配額或私密模式 */ }
}
addEventListener('resize', paintFp);
swr('/api/footprint/cells/all', { key: me.uid, onData: (data, meta) => {
  if (meta.unchanged) return;
  fpCells = data; renderFpNums(); paintFp();
} }).catch(() => {});
swr('/api/footprint/summary', { key: me.uid, onData: (data, meta) => {
  if (meta.unchanged) return;
  fpSummary = data; renderFpNums();
} }).catch(() => {});
// 鄉鎮完成度環（點進去是足跡頁的「鄉鎮」分頁）
api('/api/me/towns').then((t) => {
  const pct = t.total ? t.lit / t.total : 0, C = 2 * Math.PI * 27;
  $('#ringArc').setAttribute('stroke-dasharray', `${(pct * C).toFixed(1)} ${C.toFixed(1)}`);
  $('#ringArc').style.opacity = t.lit ? 1 : 0;  // 0% 時圓頭線帽會留一個點
  $('#ringPct').textContent = `${Math.round(pct * 100)}%`;
  $('#stTowns').textContent = t.lit;
  $('#stTownsOf').textContent = `鄉鎮 / ${t.total}`;
}).catch(() => {});
</script>
</body>
</html>
