<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>騎跡</title>
<link rel="stylesheet" href="/assets/app.css">
<style>
  .head{display:flex;justify-content:space-between;align-items:center}
  .head h1{margin:2px 0 0;font-size:28px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 form{display:flex;flex-direction:column;gap:8px}
  .fp{display:flex;align-items:center;gap:14px;cursor:pointer;color:inherit}
  .fp b{font-size:17px}
  .fog{width:54px;height:54px;border-radius:14px;flex:none;background:radial-gradient(circle at 35% 40%,transparent 0 9px,rgba(20,26,34,.9) 15px),radial-gradient(circle at 70% 65%,#5ac8fa 0 6px,transparent 7px),linear-gradient(135deg,#2b3a4a,#11161c)}
  @media (max-width:440px){.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="page">
  <div class="head">
    <div><div class="eyebrow" id="today"></div><h1 id="hello">騎跡</h1></div>
    <div style="display:flex;gap:8px;align-items:center"><span id="me"></span><button class="btn" id="logout">登出</button></div>
  </div>

  <a class="card fp" href="/footprint">
    <div class="fog" aria-hidden="true"></div>
    <div style="flex:1;min-width:0"><b>我的足跡</b><div class="small muted" id="fpSum">全年迷霧地圖，看看自己去過哪裡</div></div>
    <span class="muted">›</span>
  </a>

  <div class="row2">
    <form class="card" id="createF">
      <div class="eyebrow">臨時開團</div>
      <input class="input" id="tripName" placeholder="行程名稱，例如 武嶺日出團" maxlength="30">
      <button class="btn primary">建立行程</button>
    </form>
    <form class="card" id="joinF">
      <div class="eyebrow">加入行程</div>
      <input class="input num" id="code" placeholder="6 碼邀請碼" maxlength="6" style="text-transform:uppercase;letter-spacing:.15em">
      <button class="btn">加入</button>
    </form>
  </div>
  <div class="err" id="err"></div>

  <h2 class="sec">我的行程</h2>
  <div class="list" id="trips"><div class="li"><span class="muted">載入中…</span></div></div>
</main>
<script type="module">
import { api, $, esc, avatar, clock } from '/assets/common.js';
const ST = { planned: ['等待開始', 'info'], live: ['進行中', 'ok'], ended: ['已結束', ''] };
const d = new Date();
$('#today').textContent = `${d.getMonth() + 1} 月 ${d.getDate()} 日 星期${'日一二三四五六'[d.getDay()]}`;

const me = await api('/api/me');
$('#hello').textContent = `${d.getHours() < 11 ? '早安' : d.getHours() < 18 ? '午安' : '晚安'}，${me.nickname}`;
$('#me').innerHTML = avatar(me);
$('#logout').onclick = async () => { await api('/api/logout', { method: 'POST' }); location.href = '/login'; };

async function loadTrips() {
  const trips = await api('/api/trips');
  $('#trips').innerHTML = trips.length ? trips.map((t) => {
    const [label, cls] = ST[t.status] || ['', ''];
    const when = t.started ? `${new Date(+t.started).toLocaleDateString('zh-TW')} ${clock(+t.started)} 出發` : `建立於 ${new Date(+t.created).toLocaleDateString('zh-TW')}`;
    return `<a class="li" href="/${t.status === 'ended' ? 'replay' : 'trip'}?id=${t.id}"><div class="grow"><div class="t1">${esc(t.name)} <span class="chip ${cls}">${label}</span></div><div class="t2">${when} · ${t.member_count} 人 · 邀請碼 ${esc(t.invite)}</div></div><span class="muted">›</span></a>`;
  }).join('') : '<div class="li"><span class="muted">還沒有行程，建立一個或用邀請碼加入</span></div>';
}
async function join(code) {
  try { const t = await api('/api/trips/join', { method: 'POST', body: { code } }); location.href = '/trip?id=' + t.id; }
  catch (e) { $('#err').textContent = e.message; }
}
$('#createF').onsubmit = async (e) => {
  e.preventDefault();
  try { const t = await api('/api/trips', { method: 'POST', body: { name: $('#tripName').value || '臨時開團' } }); location.href = '/trip?id=' + t.id; }
  catch (err) { $('#err').textContent = err.message; }
};
$('#joinF').onsubmit = (e) => { e.preventDefault(); join($('#code').value.trim().toUpperCase()); };

const pending = new URLSearchParams(location.search).get('join');
if (pending) join(pending.toUpperCase());
loadTrips();
api('/api/footprint/summary').then((s) => {
  if (!s.points) return;
  const n = Object.keys(s.days).length;
  const km = Object.values(s.days).reduce((a, b) => a + b, 0);
  $('#fpSum').textContent = `${n} 天、${s.points.toLocaleString()} 個點、約 ${Math.round(km).toLocaleString()} km`;
}).catch(() => {});
</script>
</body>
</html>
