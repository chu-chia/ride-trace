<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的足跡 · 騎跡</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 足跡色：跟地圖上的軌跡同色（深藍底圖黃色、淺色底圖琥珀） */
  :root{--track:#c2410c}
  :root[data-theme="dark"]{--track:#ffd84d}
  /* 深藍底圖時，面板也帶一點藍，跟地圖是同一個世界 */
  :root[data-theme="dark"] .side.glass,:root[data-theme="dark"] .tool.glass{background:rgba(16,25,60,.86)}
  #fog{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
  .side{position:fixed;z-index:9;left:12px;top:12px;bottom:12px;width:400px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
  .side .scroll{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
  .side .scroll>*{flex-shrink:0}
  .side h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
  .side h1 a{font-size:20px;color:var(--fg)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .stats div{display:flex;flex-direction:column;min-width:0}
  .stats b{font-size:19px;font-weight:700;line-height:1.15}
  .stats span{font-size:11px;color:var(--muted)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chips button{border:0;background:var(--surface-2);border-radius:999px;padding:6px 11px;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .chips button.on{background:var(--accent-fill);color:#fff}
  .months{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
  .dates{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
  .dates input{padding:8px 10px;font-size:13.5px}
  .cal{overflow-x:auto;padding-bottom:4px}
  .cal svg{display:block}
  .cal rect{cursor:pointer}
  .label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
  .opts{display:flex;flex-direction:column;gap:8px;font-size:13.5px}
  .opts label{display:flex;gap:8px;align-items:center;cursor:pointer}
  .rangeTitle{font-size:15px;font-weight:600}
  .loading{position:fixed;z-index:9;top:16px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-size:12.5px}
  .tools{right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px))}
  @media (max-width:760px){
    .side{left:0;right:0;top:auto;bottom:0;width:auto;height:52dvh;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
    .side.small{height:150px}
    .stats b{font-size:17px}
  }
</style>
</head>
<body>
<div class="mapwrap"><div id="map"></div><canvas id="fog"></canvas></div>
<div class="tools">
  <button class="tool glass" id="bStyle" title="切換地圖風格（深藍 → 衛星 → 淺色）">深藍</button>
</div>
<div class="loading glass" id="loading" hidden>載入中…</div>

<aside class="side glass" id="side">
  <div class="scroll">
    <h1><a href="/" aria-label="回首頁">‹</a>我的足跡</h1>
    <div class="small muted" id="overall">讀取中…</div>

    <div>
      <div class="rangeTitle" id="rangeTitle">全部</div>
      <div class="small muted" id="rangeSub"></div>
    </div>
    <div class="stats">
      <div><b class="num" id="stArea">–</b><span>km² 探索面積</span></div>
      <div><b class="num" id="stCells">–</b><span>個格子</span></div>
      <div><b class="num" id="stKm">–</b><span>km 里程</span></div>
      <div><b class="num" id="stDays">–</b><span>天有紀錄</span></div>
    </div>

    <div class="label">時間範圍</div>
    <div class="chips" id="presets">
      <button data-p="all" class="on">全部</button><button data-p="7">最近 7 天</button><button data-p="30">最近 30 天</button><button data-p="90">最近 3 個月</button>
    </div>
    <div class="chips months" id="months"></div>
    <div class="dates"><input class="input num" type="date" id="from"><span class="muted">到</span><input class="input num" type="date" id="to"></div>

    <div class="label">一天中的時段</div>
    <div class="chips" id="buckets">
      <button data-b="dawn" class="on">清晨 4–8</button><button data-b="day" class="on">白天 8–17</button><button data-b="dusk" class="on">傍晚 17–20</button><button data-b="night" class="on">夜間 20–4</button>
    </div>

    <div class="label">每日里程（點一天看那天；按住 Shift 再點另一天選一段）</div>
    <div class="cal" id="cal"></div>

    <div class="opts">
      <label><input type="checkbox" id="optLines" checked> 顯示軌跡線</label>
      <label><input type="checkbox" id="optAll" checked> 其他時間去過的路淡淡顯示</label>
      <label><input type="checkbox" id="optFog"> 迷霧模式：沒去過的地方蓋起來</label>
    </div>
    <button class="btn primary" id="play">逐月播放：看足跡一個月一個月長出來</button>
  </div>
</aside>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="/assets/footprint.js"></script>
</body>
</html>
