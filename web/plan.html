<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#d9500f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>規劃路線｜騎跡 RideTrace</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* 版面照改版原型（ride-trace-redesign/plan.html）：Google 地圖式規劃。配色也照原型（深灰抽屜、藍色路線、綠色時間） */
  :root{
    --sheet:#1e1f22; --sheet-2:#2a2b2f; --sheet-3:#35363b; --ink:#fff; --ink-2:#b9bcc3; --pline:rgba(255,255,255,.09);
    --pblue:#4c8dff; --pblue-ink:#8ab4ff; --eta:#3ccf83; --pshadow:0 2px 12px rgba(0,0,0,.4);
  }
  html,body{height:100%;overflow:hidden;background:#111;color:var(--ink)}
  .hidden{display:none!important}
  .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{display:none}
  .pl button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  .pl svg{display:block}
  .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}
  .ib svg{width:22px;height:22px}

  /* ── 上方：起終點卡 ── */
  .top{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:6;max-width:440px;transition:opacity .2s,transform .2s}
  body.sheet-open .top{opacity:0;transform:translateY(-16px);pointer-events:none}
  .dir{background:var(--sheet);border-radius:18px;box-shadow:var(--pshadow);padding:6px 6px 2px 40px;position:relative}
  .dir .back{position:absolute;left:0;top:4px;color:var(--ink)}
  .dir .swap{position:absolute;right:2px;top:50%;transform:translateY(-62%)}
  .dir.two .rows,.dir.two .add{padding-right:40px}
  .rows{position:relative;max-height:calc(46px * 6);overflow-y:auto;scrollbar-width:none}
  .rows::-webkit-scrollbar{display:none}
  .row{display:flex;align-items:center;gap:2px;height:46px;position:relative;background:var(--sheet);transition:transform .18s}
  .row.drag{z-index:2;transition:none;box-shadow:0 6px 18px rgba(0,0,0,.5);border-radius:12px}
  .row .ic{width:30px;flex:none;display:grid;place-items:center;position:relative;height:100%}
  .row .ic::after{content:"";position:absolute;left:50%;top:32px;bottom:-14px;border-left:2px dotted var(--ink-2);opacity:.5;transform:translateX(-1px)}
  .row:last-child .ic::after{display:none}
  .dot-start{width:16px;height:16px;border-radius:50%;border:4px solid var(--pblue);background:#fff}
  .dot-num{width:22px;height:22px;border-radius:50%;background:#ffb020;color:#202124;font-size:12px;font-weight:800;display:grid;place-items:center}
  .dot-via{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--ink-2)}
  .dot-dest svg{width:22px;height:22px}
  .fld{flex:1;min-width:0;height:38px;border-radius:10px;background:var(--sheet-2)!important;padding:0 12px!important;text-align:left;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fld.ph{color:var(--ink-2)}
  .row .h,.row .x{width:38px;height:44px;display:grid;place-items:center;color:var(--ink-2);flex:none;touch-action:none}
  .row .h svg,.row .x svg{width:20px;height:20px}
  .add{display:flex;align-items:center;gap:2px;height:38px;color:var(--pblue-ink)!important;font-weight:600;font-size:15px;width:100%}
  .add .ic{width:30px;display:grid;place-items:center}
  .add svg{width:20px;height:20px}
  .vchips{display:flex;gap:8px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none;touch-action:pan-x}
  .vchips::-webkit-scrollbar{display:none}
  .vchip{flex:none;height:36px;padding:0 14px!important;border-radius:999px;background:var(--sheet)!important;box-shadow:var(--pshadow);font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap}
  .vchip.on{background:#d2e3fc!important;color:#174ea6!important}

  /* ── 地圖上的東西 ── */
  .wp{display:grid;place-items:center;cursor:grab;touch-action:none}
  .wp .dot-start{box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .wp .dot-num{width:28px;height:28px;font-size:14px;border:2.5px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .wp .dot-via{width:16px;height:16px;box-shadow:0 1px 6px rgba(0,0,0,.6)}
  .bub{padding:6px 10px;border-radius:10px;font-size:14px;font-weight:700;background:#3c4043;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5);white-space:nowrap;cursor:pointer;line-height:1.15;text-align:center}
  .bub small{display:block;font-size:11px;font-weight:600;opacity:.8}
  .bub.sel{background:var(--pblue);z-index:3}
  .ghost{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--pblue);box-shadow:0 0 0 8px rgba(76,141,255,.25)}
  .poi{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;border-radius:999px;background:var(--sheet);box-shadow:0 2px 8px rgba(0,0,0,.45);font-size:12px;font-weight:600;color:#fff;white-space:nowrap;cursor:pointer}
  .poi b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;border:2px solid #fff}
  .poi b svg,.pli .bx .ci2{width:14px;height:14px;color:#fff}
  .pli .bx .ci2{width:18px;height:18px}

  /* ── 長按選點卡 ── */
  .pick{position:fixed;left:8px;right:8px;z-index:7;max-width:440px;background:var(--sheet);border-radius:16px;box-shadow:var(--pshadow);padding:12px}
  .pick .ttl{font-weight:700;font-size:16px}
  .pick .sub{font-size:13px;color:var(--ink-2);margin:2px 0 10px}
  .pick .acts{display:flex;gap:8px}
  .pick .acts button{flex:1;height:44px;border-radius:12px;background:var(--sheet-2);font-size:14px;font-weight:600}
  .pick .acts button.pri{background:var(--pblue);color:#fff}

  /* ── 底部抽屜（共用 sheetDrag：transform 整塊推） ── */
  .psheet{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sheet);border-radius:20px 20px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.4);
    padding:4px 16px 0;max-width:560px;margin:0 auto;height:82vh;display:flex;flex-direction:column;overflow:hidden;
    transform:translateY(var(--sheet-off,0px));transition:transform .28s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .psheet.dragging{transition:none}
  .psheet .handle{height:22px;display:grid;place-items:center;flex:none;width:100%}
  .psheet .handle::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--ink-2);opacity:.5}
  .sum{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
  .sum .tm{font-size:28px;font-weight:700;color:var(--eta);line-height:1}
  .sum .km{font-size:18px;color:var(--ink-2);font-weight:600}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(60,207,131,.16);color:var(--eta);margin-left:auto}
  .tag:empty{display:none}
  .via{font-size:14px;color:var(--ink-2);margin:6px 0 12px}
  .pwarn{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;color:#ff8a80;background:rgba(234,67,53,.14);margin:0 0 10px}
  .pnote{font-size:13px;color:var(--ink-2);padding:10px 12px;border-radius:12px;background:var(--sheet-2)}
  .cta{display:flex;gap:10px;padding-bottom:14px}
  .cta button{height:48px;border-radius:999px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  .cta .go{flex:1.2;background:var(--pblue);color:#fff}
  .cta .apply{flex:1;background:var(--sheet-2);color:var(--pblue-ink)}
  .cta button:disabled{opacity:.45;cursor:default}
  .cta svg{width:20px;height:20px}
  .loading .tm,.loading .km{opacity:.35}
  .sheet-body{touch-action:pan-y;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);margin:0 -16px;padding-left:16px;padding-right:16px}
  .sec{margin-top:18px}
  .sec-t{font-size:13px;color:var(--ink-2);font-weight:700;margin:0 2px 8px;display:flex;justify-content:space-between;align-items:center}
  .sec-t small{font-weight:500}
  .alt{display:flex;align-items:center;gap:12px;padding:12px!important;border-radius:14px;background:var(--sheet-2)!important;margin-bottom:8px;width:100%;text-align:left;border:2px solid transparent!important}
  .alt.sel{border-color:var(--pblue)!important}
  .alt .l{flex:1;min-width:0}
  .alt .a{font-size:18px;font-weight:700;display:block}
  .alt .b{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
  .alt .r{text-align:right;font-size:14px;color:var(--ink-2)}
  .along{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;touch-action:pan-x}
  .along::-webkit-scrollbar{display:none}
  .along .vchip{box-shadow:none;background:var(--sheet-2)!important}
  .along .vchip.on{background:#d2e3fc!important;color:#174ea6!important}
  .vchip .ci2{width:18px;height:18px;flex:none}
  .along .cnt{font-size:12px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.14)}
  .pli{display:flex;align-items:center;gap:12px;padding:10px 4px!important;min-height:52px;border-bottom:1px solid var(--pline)!important;width:100%;text-align:left}
  .pli .bx{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:#fff;background:var(--sheet-3)}
  .pli .bx svg{width:20px;height:20px}
  .pli .m{flex:1;min-width:0}
  .pli .m b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pli .m span{font-size:13px;color:var(--ink-2)}
  .pli .d{font-size:13px;color:var(--ink-2);flex:none;text-align:right;line-height:1.25}
  .pli .addb{flex:none;height:32px;padding:0 12px!important;border-radius:999px;background:var(--sheet-3)!important;color:var(--pblue-ink)!important;font-size:13px;font-weight:700}
  .pli .evt{flex:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(255,176,32,.16);color:#ffb020}
  .rowbtns{display:flex;gap:8px;margin-top:10px}
  .rowbtns button{flex:1;height:44px;border-radius:12px;background:var(--sheet-2)!important;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px}
  .rowbtns svg{width:18px;height:18px}
  .gform{display:flex;gap:8px;margin-top:10px}
  .gform input{flex:1;min-width:0;height:44px;border-radius:12px;border:0;background:var(--sheet-2);color:var(--ink);padding:0 12px;font-size:15px}
  .gform button{height:44px;padding:0 16px!important;border-radius:12px;background:var(--pblue)!important;color:#fff;font-weight:700}
  .restOpt{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-2);margin-top:12px;cursor:pointer}
  .restOpt input{width:20px;height:20px;accent-color:var(--pblue)}

  /* ── 搜尋畫面 ── */
  .search{position:fixed;inset:0;z-index:20;background:var(--sheet);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  .sbar{display:flex;align-items:center;gap:4px;padding:8px}
  .sbar input{flex:1;height:46px;border-radius:12px;border:0;background:var(--sheet-2);color:var(--ink);padding:0 14px;font-size:16px;outline:none}
  .slist{flex:1;overflow-y:auto;padding:0 12px 20px}
  .slist .pnote{margin-top:12px}

  .ptoast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:30;background:#e8eaed;color:#202124;padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--pshadow);max-width:calc(100% - 32px);display:flex;align-items:center}
  .ptoast button{margin-left:14px;color:#1a73e8!important;font-weight:700}
  /* 右上工具列：排在起終點卡下面（高度會變，plan.js 寫 --top-h） */
  .tools{top:calc(var(--top-h,120px) + 8px)}
  body.sheet-open .tools{opacity:0;pointer-events:none}
  @media (min-width:700px){ .top,.pick{left:16px;right:auto;width:420px} .tools{top:max(var(--edge),env(safe-area-inset-top,0px))} }

  /* ── 手機橫向（照 Google 地圖橫向）：起終點卡和抽屜疊在左邊一欄，地圖在右邊 ── */
  @media (orientation:landscape) and (max-height:520px){
    :root{--pw:min(400px,44vw)}
    .top{right:auto;width:var(--pw);max-width:none;max-height:calc(52% - 12px);overflow-y:auto;scrollbar-width:none;border-radius:18px}
    .top::-webkit-scrollbar{display:none}
    .psheet{left:8px;right:auto;width:var(--pw);max-width:none;margin:0;height:calc(100% - 16px);bottom:8px;border-radius:20px}
    .sum .tm{font-size:24px}
    .pick{left:calc(var(--pw) + 16px);right:auto;width:min(360px,calc(100% - var(--pw) - 90px));max-width:none}
    .tools{top:max(var(--edge),env(safe-area-inset-top,0px))}
    body.sheet-open .top{opacity:1;transform:none;pointer-events:auto}
  }
</style>
</head>
<body class="pl">
<div class="mapwrap"><div id="map"></div></div>
<div class="tools">
  <button class="tool glass" id="b3d" data-icon="cube" aria-pressed="false">3D</button>
  <button class="tool glass" id="bStyle" data-icon="layers">深色</button>
</div>

<div class="top" id="top">
  <div class="dir">
    <a class="ib back" id="back" href="/" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <button class="ib swap" id="swap" aria-label="起點終點對調"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4v16M4 8l4-4 4 4M16 20V4M12 16l4 4 4-4"/></svg></button>
    <div class="rows" id="rows"></div>
    <button class="add" id="addStop"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>新增停靠站</button>
  </div>
  <div class="vchips" id="veh" role="group" aria-label="交通工具">
    <button class="vchip" data-v="scooter">一般機車</button>
    <button class="vchip" data-v="heavy">重機</button>
    <button class="vchip" data-v="car">汽車</button>
  </div>
</div>

<div class="pick hidden" id="pick">
  <div class="ttl">地圖上選的點</div>
  <div class="sub" id="pickSub"></div>
  <div class="acts"><button id="pStart">設為起點</button><button id="pStop">加為停靠站</button><button class="pri" id="pDest">設為目的地</button></div>
</div>

<section class="psheet small" id="sheet">
  <button class="handle" type="button" aria-label="展開或收合"></button>
  <div class="peek">
    <div class="sum" id="sum"><span class="tm" id="sTm">--</span><span class="km" id="sKm"></span><span class="tag" id="sTag"></span></div>
    <div class="via" id="sVia">選擇目的地開始規劃</div>
    <div id="sWarn"></div>
    <div class="cta">
      <button class="go" id="goNav" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 19-7-4-7 4z"/></svg>預覽導航</button>
      <button class="apply" id="apply" disabled>套用到行程</button>
    </div>
  </div>
  <div class="sheet-body" id="body">
    <div class="sec" id="altSec">
      <div class="sec-t">路線方案 <small id="altNote"></small></div>
      <div id="alts"></div>
    </div>
    <div class="sec">
      <div class="sec-t">沿途</div>
      <div class="along" id="along">
        <button class="vchip" data-k="fuel"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16zM3 21h14M15 9h2a2 2 0 0 1 2 2v5a1.5 1.5 0 0 0 3 0V8l-3-3"/><path d="M8 7h4v4H8z"/></svg>加油站</button><button class="vchip" data-k="convenience"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-5h13L20 9M4 9v11h16V9M4 9h16M9 20v-6h6v6"/></svg>便利商店</button><button class="vchip" data-k="rest"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h11v5a5 5 0 0 1-5 5H10a5 5 0 0 1-5-5zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 3v3M11 3v3"/></svg>休息站</button>
        <button class="vchip" data-k="food"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M16 3c-2 1-3 4-3 7h3v11"/></svg>餐廳</button><button class="vchip" data-k="sight"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>景點</button><button class="vchip" data-k="toilet"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="5" r="2"/><circle cx="17" cy="5" r="2"/><path d="M5 9h4l-.5 6H5.5zM7 15v6M15 9h4l1.5 7h-7zM17 16v5"/></svg>公廁</button>
        <button class="vchip" data-k="moto"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5l4 4M12 8l4 4-7 7H5v-4z"/></svg>機車行</button><button class="vchip" data-k="lodging"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18V7M3 13h18v5M21 13a3 3 0 0 0-3-3h-7v3M7 12a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3z"/></svg>住宿</button><button class="vchip" data-k="charging"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13h6l-1 9 8-11h-6z"/></svg>充電站</button>
        <button class="vchip" data-k="roadevent"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9.5 17h-19zM12 10v4M12 17.5v.01"/></svg>路況</button><button class="vchip" data-k="weather"><svg class="ci2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13a9 9 0 0 1 18 0zM12 13v6a2 2 0 0 0 4 0"/></svg>天氣</button>
      </div>
      <div id="alongList"></div>
    </div>
    <div class="sec">
      <div class="sec-t">路線指示 <small id="stepN"></small></div>
      <div id="steps"></div>
    </div>
    <div class="sec">
      <label class="restOpt" id="asRestWrap"><input type="checkbox" id="asRest" checked> 停靠站也當休息點（套用時一起加到行程）</label>
