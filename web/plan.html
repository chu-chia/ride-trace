<!doctype html>
<html lang="zh-Hant">
<head>
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#d9500f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="騎跡">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>規劃路線｜騎跡 RideTrace</title>
<link rel="stylesheet" href="/vendor/maplibre-gl-5.24.0/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .panel h3{margin:var(--sp-2) 2px 0;font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .panel h3{align-items:center}
  /* 看得出是按鈕：膠囊底＋圖示，可點高度 44px（UX-14） */
  .panel h3 button{display:inline-flex;align-items:center;gap:4px;min-height:44px;margin:-6px 0;border:0;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);background-clip:content-box;padding:6px 0;color:var(--accent-ink);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer}
  .panel h3 button>span{padding:0 12px 0 10px;display:inline-flex;align-items:center;gap:4px}
  .panel h3 button svg{width:14px;height:14px}
  .input{padding:10px 12px;font-size:14px}
  .note{font-size:12.5px;color:var(--muted)}
  .err{font-size:13px;color:var(--crit)}
  .warn{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;color:var(--crit);background:color-mix(in srgb,var(--crit) 12%,transparent)}
  /* 搜尋 */
  .sbox{position:relative}
  .sbox .input{padding-left:36px}
  .sbox::before{content:"⌕";position:absolute;left:12px;top:50%;transform:translateY(-52%);font-size:18px;color:var(--muted)}
  /* 下拉框要完全遮住底下的內容：面板是 .glass，裡面的 --surface 是半透明，所以用 --solid */
  .sres{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 6px);background:var(--solid);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-height:340px;overflow-y:auto}
  .sr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .sr:last-child{border-bottom:0}
  .sr:hover,.sr.on{background:var(--surface-2)}
  .sr .k{font-size:12px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface-2);color:var(--muted);flex:none}
  .sr .n{flex:1;min-width:0}
  .sr .n b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sr .n span{font-size:12px;color:var(--muted)}
  .sr .d{font-size:12px;color:var(--muted);flex:none}
  /* 途經點 */
  .pts{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
  .pt{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 0;border-bottom:1px solid var(--line);background:var(--surface)}
  .pt:last-child{border-bottom:0}
  .pt .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-fill);color:#fff;flex:none}
  .pt.s .no{background:#30d158}.pt.e .no{background:#ff453a}
  .pt .nm{flex:1;min-width:0;display:flex;flex-direction:column;padding:3px 0}
  .pt input{min-width:0;border:0;background:none;font-size:14px;color:var(--fg);padding:4px 2px}
  /* 名稱下面寫位置：名稱只是標籤，路線看的是這個位置 */
  .pt .loc{font-size:12px;line-height:1.3;color:var(--muted);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pt .loc.renamed{color:var(--warn-ink)}
  /* 點的名稱欄的地點建議：和搜尋框同一個樣子，貼在正在編輯的那一列下面 */
  .ptsbox{position:relative}
  .ptres{left:26px;right:0}
  @media (max-width:760px){.ptres{max-height:220px}}
  .ptres .sr.keep{background:color-mix(in srgb,var(--warn) 10%,var(--solid))}
  .ptres .sr.keep.on,.ptres .sr.keep:hover{background:color-mix(in srgb,var(--warn) 20%,var(--solid))}
  .pt input:focus{outline:2px solid var(--accent);border-radius:6px}
  /* ↑↓✕ 和拖曳把手都是 44px（UX-14） */
  .pt button{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;width:40px;height:44px;border-radius:10px;flex:none}
  .pt .drag{width:40px;height:44px;display:grid;place-items:center;flex:none;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .pt.dragging{position:relative;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.35);border-radius:10px;cursor:grabbing}
  .pt.dragging .drag{cursor:grabbing}
  .pts.sorting .pt:not(.dragging){transition:transform .15s ease}
  .pt-undo{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;border-radius:12px;background:var(--surface-2);font-size:13px}
  .pt-undo span{flex:1;min-width:0}
  .pt-undo button{min-height:44px;padding:0 14px;border:0;border-radius:10px;background:none;color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
  .pt button:hover:not(:disabled){background:var(--surface-2);color:var(--fg)}
  .pt button:disabled{opacity:.25;cursor:default}
  .empty{padding:14px;font-size:13px;color:var(--muted);text-align:center;line-height:1.6}
  /* 路線方案 */
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:2px solid transparent;background:var(--surface);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--fg);font:inherit}
  .opt.on{border-color:var(--accent)}
  .opt .r1{display:flex;align-items:baseline;gap:10px}
  .opt .r1 b{font-size:18px}
  .opt .r1 .me{font-size:13px;color:var(--accent);font-weight:600}
  .opt .r1 .vh{font-size:12px;color:var(--muted)}
  .opt .r2{font-size:12.5px;color:var(--muted);margin-top:2px}
  .opt .badges{display:flex;gap:6px;margin-top:4px}
  .opt .badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chips button .cnt{display:inline-block;min-width:18px;margin-left:2px;padding:0 5px;border-radius:999px;font-size:12px;background:color-mix(in srgb,currentColor 18%,transparent)}
  .sr .d{text-align:right;line-height:1.25}
  .opt .tag{font-size:12px;font-weight:700;color:var(--muted);margin-left:auto}
  /* 沿路線找 */
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{border:0;border-radius:999px;padding:7px 12px;font-size:13px;background:var(--surface-2);color:var(--fg);cursor:pointer}
  .chips button.on{background:var(--accent-fill);color:#fff;font-weight:600}
  .along{background:var(--surface);border-radius:14px;max-height:260px;overflow-y:auto}
  .al{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
  .al:last-child{border-bottom:0}
  .al i{font-style:normal;font-size:12px;color:var(--muted);width:52px;flex:none;text-align:right}
  .al .n{flex:1;min-width:0;cursor:pointer}
  .al .n b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .al .n span{font-size:12px;color:var(--muted)}
  .al .evt{font-size:12px;font-weight:600;color:var(--warn-ink);background:color-mix(in srgb,var(--warn) 16%,transparent);padding:3px 8px;border-radius:999px;flex:none}
  .poipin.evpin{cursor:default}
  .al .evt.wet{color:#fff;background:#0a84ff}
  .poipin.evpin.wxpin b{background:#0a84ff}
  .poipin.evpin b{background:var(--crit)}
  .al button{border:0;border-radius:8px;padding:5px 10px;font-size:12.5px;background:var(--surface-2);color:var(--accent);cursor:pointer;flex:none}
  details{background:var(--surface);border-radius:14px}
  details summary{padding:10px 12px;font-size:13.5px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  details summary::after{content:"▾";color:var(--muted)}
  details[open] summary::after{content:"▴"}
  details .in{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px}
  .row>.input{flex:1;min-width:0}
  .turns{max-height:260px;overflow-y:auto;margin:0 -12px -12px}
  .turn{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:7px 12px;font-size:13px;border-top:1px solid var(--line)}
  .turn i{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
  .panel-foot{flex-direction:column;align-items:stretch}
  .panel-foot label{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .panel-foot input{width:18px;height:18px;accent-color:var(--accent)}
  /* 地圖標記：不要設 position（MapLibre 標記要 absolute） */
  .wpno{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--accent-fill);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
  .wpno.s{background:#30d158}.wpno.e{background:#ff453a}
  .poipin{display:flex;align-items:center;gap:4px;padding:2px 8px 2px 2px;border-radius:999px;background:var(--glass);box-shadow:0 2px 8px rgba(0,0,0,.35);font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;cursor:pointer}
  .poipin b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:#ff9f0a;color:#1d1d1f;font-size:12px}
</style>
</head>
<body>
<div class="mapwrap"><div id="map"></div></div>
<div class="tools">
  <button class="tool glass" id="b3d" data-icon="cube" aria-pressed="false">3D</button>
  <button class="tool glass" id="bStyle" data-icon="layers">深色</button>
</div>
<aside class="panel glass" id="panel">
  <button class="handle" aria-expanded="true"></button>
  <div class="panel-head"><a class="icon-btn" id="back" href="/" data-icon="back" aria-label="回行程"></a><div class="panel-title"><b>規劃路線</b><div class="sub" id="tName">載入中…</div></div><button class="icon-btn panel-collapse" data-icon="collapse" aria-expanded="true"></button></div>
  <div class="panel-mini"><span id="miniRoute">還沒有路線</span></div>
  <div class="panel-body">
    <div class="sbox">
      <input class="input" id="q" placeholder="搜尋地點，或直接點地圖加入" autocomplete="off" enterkeyhint="search">
      <div class="sres" id="sres" hidden></div>
    </div>
    <h3>路線 <button id="useMe" type="button"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>用我的位置當起點</span></button></h3>
    <div class="ptsbox"><div class="pts" id="pts"></div><div class="sres ptres" id="ptres" role="listbox" aria-label="換成這個地點" hidden></div></div>
    <div class="pt-undo" id="ptUndo" role="status" hidden><span></span><button type="button">復原</button></div>

    <h3>交通工具</h3>
    <div class="seg" id="veh"><button data-v="scooter" class="on">機車</button><button data-v="heavy">重機</button><button data-v="car">汽車</button></div>
    <div class="note" id="vehNote"></div>

    <div id="msg"></div>
    <div id="result" hidden>
      <h3 id="optTitle">路線</h3>
      <div class="opts" id="opts" role="radiogroup" aria-labelledby="optTitle"></div>
      <div class="note" id="paceNote"></div>

      <h3 style="margin-top:6px">沿路線找</h3>
      <div class="chips" id="chips">
        <button data-k="fuel">加油站</button><button data-k="convenience">便利商店</button><button data-k="food">餐廳</button>
        <button data-k="sight">景點</button><button data-k="lodging">住宿</button><button data-k="rest">休息站</button><button data-k="moto">機車行</button><button data-k="toilet">公廁</button><button data-k="charging">充電站</button><button data-k="roadevent">路況</button><button data-k="weather">天氣</button>
      </div>
      <div class="along" id="along" hidden></div>

      <details id="turnBox"><summary>轉彎指示 <span class="note" id="turnCount"></span></summary><div class="in"><div class="turns" id="turns"></div></div></details>
    </div>

    <details id="gBox">
      <summary>從 Google Maps 匯入</summary>
      <div class="in">
        <form class="row" id="gForm"><input class="input" id="gUrl" placeholder="貼上 Google Maps 路線的分享連結" autocomplete="off"><button class="btn">匯入</button></form>
      </div>
    </details>
  </div>
  <div class="panel-foot">
    <label id="asRestWrap"><input type="checkbox" id="asRest" checked> 停靠點也當休息點</label>
    <button class="btn primary block" id="apply" disabled>套用到行程</button>
    <button class="btn block" id="clear" hidden>清除行程的路線</button>
  </div>
</aside>
<script src="/vendor/maplibre-gl-5.24.0/maplibre-gl.js"></script>
<script type="module" src="/assets/plan.js"></script>
</body>
</html>
