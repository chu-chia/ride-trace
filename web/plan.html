<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>規劃路線 · 騎跡</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .pl{position:fixed;z-index:9;left:12px;top:12px;bottom:12px;width:380px;border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
  .pl header{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
  .pl header a{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;color:var(--fg);text-decoration:none}
  .pl header b{font-size:16px;display:block}
  .pl header span{font-size:12px;color:var(--muted)}
  .pl .body{flex:1;overflow-y:auto;padding:6px 14px 14px;display:flex;flex-direction:column;gap:12px}
  .pl .body>*{flex-shrink:0} /* 轉彎指示很長時，不要把途經點清單擠成 0 高 */
  .pl h3{margin:4px 2px 0;font-size:13px;color:var(--muted);font-weight:600}
  .row{display:flex;gap:8px}
  .row>.input{flex:1;min-width:0}
  .input{padding:10px 12px;font-size:14px}
  .pts{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
  .pt{display:flex;align-items:center;gap:8px;padding:7px 8px 7px 10px;border-bottom:1px solid var(--line)}
  .pt:last-child{border-bottom:0}
  .pt .no{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);flex:none}
  .pt:first-child .no{background:#30d158;color:#fff}
  .pt:last-child .no{background:#ff453a;color:#fff}
  .pt input{flex:1;min-width:0;border:0;background:none;font-size:14px;color:var(--fg);padding:4px 2px}
  .pt input:focus{outline:2px solid var(--accent);border-radius:6px}
  .pt button{border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;width:28px;height:28px;border-radius:8px}
  .pt button:hover{background:var(--surface-2);color:var(--fg)}
  .empty{padding:14px;font-size:13px;color:var(--muted);text-align:center}
  .opt{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .opt input{width:18px;height:18px;accent-color:var(--accent)}
  .sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface);border-radius:14px;padding:12px}
  .sum div{display:flex;flex-direction:column}
  .sum b{font-size:20px;line-height:1.1}
  .sum span{font-size:11.5px;color:var(--muted)}
  .turns{background:var(--surface);border-radius:14px;max-height:220px;overflow-y:auto}
  .turn{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:7px 12px;font-size:13px;border-bottom:1px solid var(--line)}
  .turn:last-child{border-bottom:0}
  .turn i{font-style:normal;color:var(--muted);font-size:12px;text-align:right}
  .note{font-size:12.5px;color:var(--muted)}
  .err{font-size:13px;color:var(--crit)}
  .foot{padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
  /* 地圖上的途經點：不要設 position（MapLibre 標記要 absolute） */
  .wpno{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;background:var(--accent);border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:grab}
  .wpno.s{background:#30d158}.wpno.e{background:#ff453a}
  .tools{right:12px;top:12px}
  @media (max-width:760px){
    .pl{left:0;right:0;top:auto;bottom:0;width:auto;height:52dvh;border-radius:22px 22px 0 0}
  }
</style>
</head>
<body>
<div class="mapwrap"><div id="map"></div></div>
<div class="tools">
  <button class="tool glass" id="bStyle" title="切換地圖風格">深色</button>
  <button class="tool glass" id="b3d" title="3D 地形">3D</button>
</div>
<aside class="pl glass">
  <header><a id="back" href="/" aria-label="回行程">‹</a><div><b>規劃路線</b><span id="tName">載入中…</span></div></header>
  <div class="body">
    <h3>從 Google Maps 匯入</h3>
    <form class="row" id="gForm"><input class="input" id="gUrl" placeholder="貼上 Google Maps 路線的分享連結" autocomplete="off"><button class="btn">匯入</button></form>
    <div class="note">Google 的連結只帶得出起點、終點和途經點，路線由騎跡用機車模式重新計算；想固定走哪條路，就在 Google Maps 多加幾個途經點。</div>
    <h3>途經點 <span class="note" style="font-weight:400">（在地圖上點一下加入，點可以拖曳）</span></h3>
    <div class="pts" id="pts"></div>
    <h3>交通工具</h3>
    <div class="seg" id="veh"><button data-v="scooter" class="on">機車</button><button data-v="heavy">重機</button><button data-v="car">汽車</button></div>
    <div class="note" id="vehNote"></div>
    <div id="msg"></div>
    <div id="result" hidden>
      <div class="sum"><div><b class="num" id="sKm">–</b><span>公里</span></div><div><b class="num" id="sMin">–</b><span>預估時間</span></div><div><b class="num" id="sTurn">–</b><span>個轉彎</span></div></div>
      <h3 style="margin-top:12px">轉彎指示</h3>
      <div class="turns" id="turns"></div>
    </div>
  </div>
  <div class="foot">
    <label class="opt" id="asRestWrap"><input type="checkbox" id="asRest" checked> 中途的途經點也設成休息點</label>
    <button class="btn primary block" id="apply" disabled>套用到行程</button>
    <button class="btn block" id="clear" hidden>清除行程的路線</button>
  </div>
</aside>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script type="module" src="/assets/plan.js"></script>
</body>
</html>
