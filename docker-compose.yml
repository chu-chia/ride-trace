# 固定 compose 專案名稱：資料夾改名 ride-trace 後仍沿用原本的 qiji_redis-data volume
name: qiji

services:
  redis:
    image: redis:8.2
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "300 10"
      - --notify-keyspace-events
      - Ex
      # 密碼放 .env 的 REDIS_PASSWORD；沒設就不啟動，避免裸奔
      - --requirepass
      - ${REDIS_PASSWORD:?請在 .env 設定 REDIS_PASSWORD}
    environment:
      # 讓 docker compose exec redis redis-cli 不用另外打 -a
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    # 只綁本機：手機與朋友走 Tailscale serve → 8750，不需要直接連 Redis
    ports:
      - "127.0.0.1:6390:6379"
    # 載入 AOF 期間 PING 會回 LOADING，等真的 PONG 才讓 api／worker 啟動
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      WEB_DIR: /web
      VALHALLA_URL: http://valhalla:8002
      ADMIN_USERS: ${ADMIN_USERS:-wei}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
      CWA_API_KEY: ${CWA_API_KEY:-}
      FAKE_EXTERNAL: ${FAKE_EXTERNAL:-}
    volumes:
      - ./web:/web:ro
    ports:
      - "8750:8750"
    depends_on:
      redis:
        condition: service_healthy
    # Demo 要等 api 真的能回應才開始（不然第一次連線失敗、靠重啟才接上）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8750/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # 背景 Worker：Streams consumer group 消費 stream:ingest（統計、之後的落隊／抵達／測速警示）。
  # 多開幾個會自動分攤：docker compose up -d --scale worker=2
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      VALHALLA_URL: http://valhalla:8002
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
      CWA_API_KEY: ${CWA_API_KEY:-}
      FAKE_EXTERNAL: ${FAKE_EXTERNAL:-}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Demo #57 無限循環：3/14 中橫真實版（你的紀錄＋4 個機器人），一圈約 5 小時，跑完休 30 秒重置再跑。
  # 以前在 Mac 用 nohup 跑，筆電一闔就斷；放進 compose 後開機自動跑、當掉自動重啟。
  # Demo 行程（trip hash demo=1）不推播。不要的話：docker compose stop demo
  demo:
    build: ./backend
    command: ["python", "-u", "-m", "tools.simulate", "--group", "zh314", "--trip", "57", "--speed", "1",
              "--interval", "2", "--loop", "--base", "http://api:8750", "--tracks", "/data/tracks"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SIM_BOT_PASSWORD: ${SIM_BOT_PASSWORD:-}
    volumes:
      - ./data/tracks:/data/tracks:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 路線引擎：地圖比對（把 GPS 點對到道路上）、之後的機車導航。
  # 第一次啟動會下載台灣 OSM（約 330 MB）並建立路網，約 10～30 分鐘。
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.2
    environment:
      tile_urls: https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      force_rebuild: "False"
    ports:
      - "127.0.0.1:8752:8002"
    volumes:
      - ./data/valhalla:/custom_files
    restart: unless-stopped

volumes:
  # 用 named volume，Windows Docker Desktop 上 AOF 寫入比 bind mount 快很多
  redis-data:
