services:
  redis:
    image: redis:8.2
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "300 10"
      - --notify-keyspace-events
      - Ex
    ports:
      - "6390:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      REDIS_URL: redis://redis:6379/0
      WEB_DIR: /web
      VALHALLA_URL: http://valhalla:8002
      ADMIN_USERS: ${ADMIN_USERS:-wei}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
    volumes:
      - ./web:/web:ro
    ports:
      - "8750:8750"
    depends_on:
      - redis
    restart: unless-stopped

  # 背景 Worker：Streams consumer group 消費 stream:ingest（統計、之後的落隊／抵達／測速警示）。
  # 多開幾個會自動分攤：docker compose up -d --scale worker=2
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      VALHALLA_URL: http://valhalla:8002
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      TDX_CLIENT_ID: ${TDX_CLIENT_ID:-}
      TDX_CLIENT_SECRET: ${TDX_CLIENT_SECRET:-}
    depends_on:
      - redis
    restart: unless-stopped

  # 路線引擎：地圖比對（把 GPS 點對到道路上）、之後的機車導航。
  # 第一次啟動會下載台灣 OSM（約 330 MB）並建立路網，約 10～30 分鐘。
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.2
    environment:
      tile_urls: https://download.geofabrik.de/asia/taiwan-latest.osm.pbf
      serve_tiles: "True"
      build_elevation: "False"
      build_admins: "True"
      build_time_zones: "False"
      force_rebuild: "False"
    ports:
      - "8752:8002"
    volumes:
      - ./data/valhalla:/custom_files
    restart: unless-stopped

volumes:
  # 用 named volume，Windows Docker Desktop 上 AOF 寫入比 bind mount 快很多
  redis-data:
